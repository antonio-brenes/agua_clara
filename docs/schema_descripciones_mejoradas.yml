- name: l4_situacio_fact
  description: 'Histórico de transiciones de estado de una factura. Granularidad: un evento de situación por partición, factura y marca temporal del cambio.'
  tests:
  - dbt_utils.unique_combination_of_columns:
      arguments:
        combination_of_columns:
        - NUM_PARTICIO
        - ID_EMPRESA
        - ANY_FACTURA
        - NUM_FACTURA
        - MOM_SIT_FACT
  - relationships_compound:
      arguments:
        to: '{{ ref(''l4_fact_resum'') }}'
        local_columns:
        - ID_EMPRESA
        - ANY_FACTURA
        - NUM_FACTURA
        field_columns:
        - ID_EMPRESA
        - ANY_FACTURA
        - NUM_FACTURA
  columns:
  - name: NUM_PARTICIO
    description: Número de partición técnica utilizado para distribuir o localizar físicamente la factura. Forma parte de la clave primaria.
    tests:
    - not_null
  - name: ID_EMPRESA
    description: Código de la empresa emisora o suministradora. Forma parte de la clave primaria. Forma parte de una clave foránea hacia l4_fact_resum.ID_EMPRESA.
    tests:
    - not_null
  - name: ANY_FACTURA
    description: Año de emisión que forma parte de la identificación de la factura. Forma parte de la clave primaria. Forma parte de una clave foránea hacia l4_fact_resum.ANY_FACTURA.
    tests:
    - not_null
  - name: NUM_FACTURA
    description: Número secuencial de la factura dentro de la empresa y año. Forma parte de la clave primaria. Forma parte de una clave foránea hacia l4_fact_resum.NUM_FACTURA.
    tests:
    - not_null
  - name: MOM_SIT_FACT
    description: Fecha y hora en que la factura alcanzó la situación registrada. Forma parte de la clave primaria.
    tests:
    - not_null
  - name: TIP_SIT_FACT
    description: Código de situación de factura; debe existir en L4_CODIFICACIONS para la familia R01.
    tests:
    - not_null
  - name: CAUSA_SIT_FACT
    description: Código de causa que explica el cambio de situación de la factura.
    tests:
    - not_null

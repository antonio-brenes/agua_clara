version: 2
models:
- name: l4_codificacions
  description: Maestro de códigos. Un registro por código.
  tests:
  - dbt_utils.unique_combination_of_columns:
      arguments:
        combination_of_columns:
        - TIP_CODI
        - CLAU_CODI
  columns:
  - name: TIP_CODI
    description: Tipo de código. Parte de la clave primaria.
    tests:
    - not_null
  - name: CLAU_CODI
    description: Clave de código. Parte de la clave primaria.
    tests:
    - not_null
  - name: DESC_CODI
    description: Descripción completa del código.
    tests:
    - not_null
  - name: DESC_BREU
    description: Descripción breve del código.
    tests:
    - not_null
  - name: ID_CARGA
    description: Identificador técnico del lote o ejecución que incorporó el registro.
  - name: FECHA_CARGA
    description: Fecha y hora de carga normalizada a Europe/Madrid.
  - name: SISTEMA_ORIGEN
    description: Sistema de origen heredado de RAW.
  - name: TABLA_ORIGEN
    description: Tabla RAW de procedencia.
- name: l4_municipi_sgab
  description: Maestro de municipios de SGAB. Un registro por municipio.
  tests:
  - dbt_utils.unique_combination_of_columns:
      arguments:
        combination_of_columns:
        - NUM_MUN_SGAB
  columns:
  - name: NUM_MUN_SGAB
    description: Número de municipio de SGAB. Clave primaria.
    tests:
    - not_null
    - unique
  - name: NOM_MUN_SGAB
    description: Nombre del municipio de SGAB.
    tests:
    - not_null
  - name: QL_CRITERI_FACT
    description: Criterio de facturación.
    tests:
    - not_null
  - name: ID_MUN_CP_UNIC
    description: Código postal único del municipio.
    tests:
    - not_null
  - name: CP_PROVINCIA
    description: Código postal de la provincia.
    tests:
    - not_null
  - name: UNITAT_REPARTIMENT
    description: Unitad de reparto.
    tests:
    - not_null
  - name: NUM_DTE_POST
    description: Número de distrito postal.
    tests:
    - not_null
  - name: NUM_DEL_SGAB
    description: Número de Número de Delegación de SGAB.
    tests:
    - not_null
  - name: NUM_AGENCIA_SGAB
    description: Número de agencia de SGAB.
    tests:
    - not_null
  - name: ID_AREA_LECT
    description: Identificador del área de lectura.
    tests:
    - not_null
  - name: ID_EMPRESA
    description: Identificador de la empresa suministradora.
    tests:
    - not_null
  - name: DELEGA_CO
    description: Código de delegación.
  - name: QL_GEST_DTE
    description: Gestión de calidad del distrito.
    tests:
    - not_null
  - name: ID_MUNI_ENT_MET
    description: Indicador de Área Metropolitana de Barcelona.
    tests:
    - not_null
  - name: NOMB_DIES_ANS
    description: Número de dias de antelación.
    tests:
    - not_null
  - name: MUNI_GENERALITAT
    description: Municipio de la Generalitat.
  - name: CODI_PROV
    description: Código de la provincia.
  - name: CODI_MUNI
    description: Código del municipio de 4 dígitos, estándar de Explotación Operativa (SGAB).
  - name: QL_TIPUS_VENDA
    description: Calidad del tipo de venta.
    tests:
    - not_null
  - name: CODI_MUNICIPI
    description: Código del municipio de 3 dígitos, estándar oficial (INE / Idescat).
  - name: NOMB_DIES_INDEMN
    description: Número de días que la empresa debe abonar o compensar al cliente en caso de cortes de servicio no programados que superen el límite legal establecido
      en el reglamento.
  - name: NOMB_DIES_SENSE_AUT
    description: Número de días sin autorización. Alude a los días en los que un suministro ha estado activo de manera irregular.
  - name: ADHERIT_L24
    description: Adherido a L24 (Ley 24/2015, de 29 de julio, de medidas urgentes para afrontar la emergencia en el ámbito de la vivienda y la pobreza energética).
  - name: CARTA_CIRER
    description: Carta CIRER. Es un modelo de carta de notificación de deuda, siendo la primera carta de aviso de impago que se envía al cliente tras vencer el recibo.
  - name: NUM_CAIPS
    description: Número de CAIPS.
  - name: NUM_DIAS_ENV_CAIPS
    description: Número de días de envío a CAIPS. Número de días de margen que el sistema espera desde que se genera la deuda (o desde la primera notificación) hasta
      que los datos se exportan y envían a la plataforma/proveedor CAIPS (módulo centralizado de gestión de impagos o centro de impresión que emite la notificación
      física de suspensión)
  - name: CARTA_CIRER_2
    description: Carta CIRER 2. Es un modelo de carta de notificación de deuda, siendo la segunda carta de aviso de impago (frecuentemente la carta certificada o
      burofax que sirve como preaviso legal obligatorio antes de interrumpir el servicio).
  - name: NUM_DIAS_CIRER_2
    description: Número de días de espera entre el primer y el segundo aviso de impago.
  - name: NUM_DIAS_GENERA_CORTE
    description: El plazo legal/operativo en días que debe transcurrir tras las cartas de aviso para que el sistema genere automáticamente la orden física de corte
      de suministro (suspensión por impago).
  - name: ID_CARGA
    description: Identificador técnico del lote o ejecución que incorporó el registro.
  - name: FECHA_CARGA
    description: Fecha y hora de carga normalizada a Europe/Madrid.
  - name: SISTEMA_ORIGEN
    description: Sistema de origen heredado de RAW.
  - name: TABLA_ORIGEN
    description: Tabla RAW de procedencia.
- name: l4_dte_municipal
  description: 'Maestro de distritos o demarcaciones municipales. Granularidad: un registro por combinación de municipio SGAB y distrito municipal.'
  tests:
  - dbt_utils.unique_combination_of_columns:
      arguments:
        combination_of_columns:
        - NUM_MUN_SGAB
        - NUM_DTE_MUNI
  - relationships_compound:
      arguments:
        to: '{{ ref(''l4_municipi_sgab'') }}'
        local_columns:
        - NUM_MUN_SGAB
        field_columns:
        - NUM_MUN_SGAB
  columns:
  - name: NUM_MUN_SGAB
    description: Código interno del municipio en SGAB. Forma parte de la clave primaria. Forma parte de una clave foránea hacia l4_municipi_sgab.NUM_MUN_SGAB.
    tests:
    - not_null
  - name: NUM_DTE_MUNI
    description: Código del distrito o demarcación dentro del municipio. Forma parte de la clave primaria.
    tests:
    - not_null
  - name: NOM_DTE_MUNI
    description: Nombre descriptivo del distrito o demarcación municipal.
    tests:
    - not_null
  - name: NUM_DEL_SGAB
    description: Código de la delegación SGAB responsable.
    tests:
    - not_null
  - name: NUM_AGENCIA_SGAB
    description: Código de la agencia SGAB responsable.
    tests:
    - not_null
  - name: CODI_AREA_SD
    description: Código del área de servicio o distribución asignada al distrito.
    tests:
    - not_null
  - name: ID_CARGA
    description: Identificador técnico del lote o ejecución que incorporó el registro.
  - name: FECHA_CARGA
    description: Fecha y hora de carga del registro, normalizada a Europe/Madrid.
  - name: SISTEMA_ORIGEN
    description: Código del sistema de origen del registro, heredado de la capa RAW.
  - name: TABLA_ORIGEN
    description: Nombre de la tabla o fichero RAW del que procede el registro.
- name: l4_epigraf_iae
  description: 'Catálogo de epígrafes del Impuesto sobre Actividades Económicas utilizados para clasificar la actividad del suministro y parametrizar tarifas y tasas.
    Granularidad: un registro por sección y epígrafe IAE.'
  tests:
  - dbt_utils.unique_combination_of_columns:
      arguments:
        combination_of_columns:
        - SECCIO
        - EPIGRAF_IAE
  columns:
  - name: SECCIO
    description: Sección de actividad económica que agrupa el epígrafe IAE. Forma parte de la clave primaria.
    tests:
    - not_null
  - name: EPIGRAF_IAE
    description: Código del epígrafe IAE que identifica la actividad económica. Forma parte de la clave primaria.
    tests:
    - not_null
  - name: DESCR_IAE
    description: Descripción de la actividad económica correspondiente al epígrafe IAE.
    tests:
    - not_null
  - name: TIP_TARIFA
    description: Código de tipo de tarifa asociado a la actividad económica.
    tests:
    - not_null
  - name: TIP_QUOTA_TAMGREM
    description: Tipo de cuota TAMGREM aplicable a la actividad o padrón.
    tests:
    - not_null
  - name: NIV_GEN_RES
    description: Nivel de generación de residuos asignado a la actividad.
    tests:
    - not_null
  - name: COD_GEN_RES
    description: Código de categoría de generación de residuos.
    tests:
    - not_null
  - name: ID_CARGA
    description: Identificador técnico del lote o ejecución que incorporó el registro.
  - name: FECHA_CARGA
    description: Fecha y hora de carga del registro, normalizada a Europe/Madrid.
  - name: SISTEMA_ORIGEN
    description: Código del sistema de origen del registro, heredado de la capa RAW.
  - name: TABLA_ORIGEN
    description: Nombre de la tabla o fichero RAW del que procede el registro.
- name: l4_carrer
  description: 'Maestro de vías públicas de los municipios gestionados. Granularidad: un registro por combinación de municipio SGAB y número de calle.'
  tests:
  - dbt_utils.unique_combination_of_columns:
      arguments:
        combination_of_columns:
        - NUM_MUN_SGAB
        - NUM_CARRER
  - relationships_compound:
      arguments:
        to: '{{ ref(''l4_municipi_sgab'') }}'
        local_columns:
        - NUM_MUN_SGAB
        field_columns:
        - NUM_MUN_SGAB
  columns:
  - name: NUM_MUN_SGAB
    description: Código interno del municipio en SGAB. Forma parte de la clave primaria. Forma parte de una clave foránea hacia l4_municipi_sgab.NUM_MUN_SGAB.
    tests:
    - not_null
  - name: NUM_CARRER
    description: Número interno que identifica la vía dentro del municipio. Forma parte de la clave primaria.
    tests:
    - not_null
  - name: CLASSE_CARRER
    description: Clase o categoría administrativa de la vía.
    tests:
    - not_null
  - name: NOM_ABREUJ_CARRER
    description: Nombre abreviado de la vía, destinado a formatos de espacio limitado.
    tests:
    - not_null
  - name: TIP_DENOMIN_CARRER
    description: Tipo de denominación de la vía, como calle, avenida o paseo.
    tests:
    - not_null
  - name: NOM_COMPLET_CARRER
    description: Nombre completo normalizado de la vía.
    tests:
    - not_null
  - name: ID_CARRER_SAP
    description: Identificador equivalente de la vía en SAP.
    tests:
    - not_null
  - name: QL_CARRER
    description: Indicador de calidad, validez o tratamiento del registro de calle.
    tests:
    - not_null
  - name: ID_CARGA
    description: Identificador técnico del lote o ejecución que incorporó el registro.
  - name: FECHA_CARGA
    description: Fecha y hora de carga del registro, normalizada a Europe/Madrid.
  - name: SISTEMA_ORIGEN
    description: Código del sistema de origen del registro, heredado de la capa RAW.
  - name: TABLA_ORIGEN
    description: Nombre de la tabla o fichero RAW del que procede el registro.
- name: l4_finca
  description: 'Maestro de fincas o rangos de numeración postal, con atributos territoriales, técnicos y de planificación de lectura. Granularidad: un registro por
    clave completa de finca dentro de una calle y municipio.'
  tests:
  - dbt_utils.unique_combination_of_columns:
      arguments:
        combination_of_columns:
        - NUM_MUN_SGAB
        - NUM_CARRER
        - NUM_INI_FINCA
        - COMP_NUM_INI_FINCA
        - NUM_FIN_FINCA
        - COMP_NUM_FIN_FINCA
        - SIT_FINCA_ESPEC
        - ORD_FINCA_ESPEC
  - relationships_compound:
      arguments:
        to: '{{ ref(''l4_carrer'') }}'
        local_columns:
        - NUM_MUN_SGAB
        - NUM_CARRER
        field_columns:
        - NUM_MUN_SGAB
        - NUM_CARRER
  columns:
  - name: NUM_MUN_SGAB
    description: Código interno del municipio en SGAB. Forma parte de la clave primaria. Forma parte de una clave foránea hacia l4_carrer.NUM_MUN_SGAB.
    tests:
    - not_null
  - name: NUM_CARRER
    description: Número interno que identifica la vía dentro del municipio. Forma parte de la clave primaria. Forma parte de una clave foránea hacia l4_carrer.NUM_CARRER.
    tests:
    - not_null
  - name: NUM_INI_FINCA
    description: Número inicial del rango postal que identifica la finca. Forma parte de la clave primaria.
    tests:
    - not_null
  - name: COMP_NUM_INI_FINCA
    description: Complemento al número inicial de finca, como letra o sufijo. Forma parte de la clave primaria.
    tests:
    - not_null
  - name: NUM_FIN_FINCA
    description: Número final del rango postal de la finca. Forma parte de la clave primaria.
    tests:
    - not_null
  - name: COMP_NUM_FIN_FINCA
    description: Complemento al número final de finca. Forma parte de la clave primaria.
    tests:
    - not_null
  - name: SIT_FINCA_ESPEC
    description: Código de situación especial utilizado para diferenciar fincas con la misma numeración. Forma parte de la clave primaria.
    tests:
    - not_null
  - name: ORD_FINCA_ESPEC
    description: Ordinal que distingue fincas especiales con igual dirección base. Forma parte de la clave primaria.
    tests:
    - not_null
  - name: NUM_TORN_LECT_MENS
    description: Turno mensual de lectura asignado a la finca; permite derivar el ciclo operativo 1, 11 o 21.
    tests:
    - not_null
  - name: ORD_FINCA_TORN_MEN
    description: Orden de visita de la finca dentro del turno mensual de lectura.
    tests:
    - not_null
  - name: NUM_DTE_POST_FINCA
    description: Código del distrito postal de la finca.
    tests:
    - not_null
  - name: ESTAT_FINCA
    description: Estado operativo o administrativo de la finca.
    tests:
    - not_null
  - name: ID_GRUP_ELEV_FINCA
    description: Identificador del grupo de elevación o presión al que pertenece la finca.
    tests:
    - not_null
  - name: PRES_XARXA_FINCA
    description: Presión de red asociada a la finca.
    tests:
    - not_null
  - name: CAT_FISCAL_FINCA
    description: Categoría fiscal asignada a la finca.
    tests:
    - not_null
  - name: ALTURA_FINCA
    description: Altura o número de plantas considerado para la finca.
    tests:
    - not_null
  - name: ID_FINCA_RENDA_LIM
    description: Indicador de finca acogida a un régimen de renta limitada.
    tests:
    - not_null
  - name: NUM_EXP_RENDA_LIM
    description: Número de expediente del régimen de renta limitada.
    tests:
    - not_null
  - name: NUM_ZONA_RECOR
    description: Código de la zona del recorrido de lectura.
    tests:
    - not_null
  - name: NUM_TRAVES
    description: Número de travesía o secuencia dentro del recorrido.
    tests:
    - not_null
  - name: CASA_RECOR_PERIOD
    description: Identificador o secuencia de la finca dentro del recorrido periódico.
    tests:
    - not_null
  - name: NUM_NUS_XARXA
    description: Identificador del nodo de red asociado a la finca.
    tests:
    - not_null
  - name: ID_LOT_LECT
    description: Identificador del lote de lectura.
  - name: OBS_ADRE_INCOMPLET
    description: Observación sobre una dirección incompleta o pendiente de normalización.
    tests:
    - not_null
  - name: PARTICULARIT_FINCA
    description: Descripción de particularidades físicas u operativas de la finca.
    tests:
    - not_null
  - name: LOCAL_CLAUS_FINCA
    description: Ubicación o referencia del lugar donde se custodian llaves de acceso.
    tests:
    - not_null
  - name: QL_COMPT_ELECTRON
    description: Indicador de disponibilidad o tratamiento de contadores electrónicos.
    tests:
    - not_null
  - name: NUM_DTE_MUNI_FINCA
    description: Código del distrito municipal al que pertenece la finca.
    tests:
    - not_null
  - name: QL_BATERIA_CABLE
    description: Indicador de batería de contadores cableada o preparada para telelectura.
    tests:
    - not_null
  - name: CODI_UBICACIO_SAP
    description: Código de ubicación técnica de la finca en SAP.
  - name: ID_CARGA
    description: Identificador técnico del lote o ejecución que incorporó el registro.
  - name: FECHA_CARGA
    description: Fecha y hora de carga del registro, normalizada a Europe/Madrid.
  - name: SISTEMA_ORIGEN
    description: Código del sistema de origen del registro, heredado de la capa RAW.
  - name: TABLA_ORIGEN
    description: Nombre de la tabla o fichero RAW del que procede el registro.
- name: l4_ramal
  description: 'Maestro de ramales o acometidas que conectan la red con una finca y sirven de soporte técnico a uno o varios suministros. Granularidad: un registro
    por póliza de ramal.'
  tests:
  - dbt_utils.unique_combination_of_columns:
      arguments:
        combination_of_columns:
        - POLISSA_RAMAL
  - relationships_compound:
      arguments:
        to: '{{ ref(''l4_finca'') }}'
        local_columns:
        - NUM_MUN_SGAB
        - NUM_CARRER
        - NUM_INI_FINCA
        - COMP_NUM_INI_FINCA
        - NUM_FIN_FINCA
        - COMP_NUM_FIN_FINCA
        - SIT_FINCA_ESPEC
        - ORD_FINCA_ESPEC
        field_columns:
        - NUM_MUN_SGAB
        - NUM_CARRER
        - NUM_INI_FINCA
        - COMP_NUM_INI_FINCA
        - NUM_FIN_FINCA
        - COMP_NUM_FIN_FINCA
        - SIT_FINCA_ESPEC
        - ORD_FINCA_ESPEC
  columns:
  - name: POLISSA_RAMAL
    description: Identificador de la póliza de ramal o acometida. Forma parte de la clave primaria.
    tests:
    - not_null
  - name: DVER_POLISSA_RAMAL
    description: Dígitos o valor de verificación de la póliza de ramal.
    tests:
    - not_null
  - name: SIT_RAMAL
    description: Situación operativa del ramal, por ejemplo activo o de baja.
    tests:
    - not_null
  - name: TIP_OPER_RAMAL
    description: Tipo de operación o modalidad técnica del ramal.
    tests:
    - not_null
  - name: US_RAMAL
    description: Uso principal asignado al ramal.
    tests:
    - not_null
  - name: MATERIAL_RAMAL
    description: Material de fabricación del ramal.
    tests:
    - not_null
  - name: DATA_INST_RAMAL
    description: Fecha de instalación o puesta en servicio del ramal.
    tests:
    - not_null
  - name: DIAMETRE_RAMAL
    description: Diámetro nominal del ramal.
    tests:
    - not_null
  - name: SIT_CLAU_PAS
    description: Situación o disponibilidad de la llave de paso del ramal.
    tests:
    - not_null
  - name: DATA_SIG_CTE_RAMAL
    description: Fecha efectiva desde la que aplican las características técnicas actuales del ramal.
    tests:
    - not_null
  - name: TIP_SUBM_CTE_RAMAL
    description: Tipo de suministro considerado en la configuración técnica vigente del ramal.
    tests:
    - not_null
  - name: NOMB_JOC_CLAUS_CTE
    description: Número de juegos de llaves asociados a la configuración vigente.
    tests:
    - not_null
  - name: DATA_PART_INST_RAM
    description: Fecha del parte de instalación del ramal.
    tests:
    - not_null
  - name: NUM_PART_INST_RAM
    description: Número identificador del parte de instalación.
    tests:
    - not_null
  - name: QL_ARQUETA_ARMARI
    description: Indicador de ubicación del conjunto en arqueta o armario.
    tests:
    - not_null
  - name: ESTAT_ARQUETA_ARM
    description: Estado de conservación de la arqueta o armario.
    tests:
    - not_null
  - name: ID_CIR_RECUP_AIGUA
    description: Indicador de circuito de recuperación o reutilización de agua.
    tests:
    - not_null
  - name: NUM_SOL_LIC_AFEC
    description: Número de solicitud o licencia relacionada con una afección del ramal.
  - name: DATA_SOL_BAIXA_RAM
    description: Fecha de solicitud de baja del ramal.
    tests:
    - not_null
  - name: DNI_NIF_CLIENT
    description: Documento identificativo fiscal del cliente o titular.
    tests:
    - not_null
  - name: NUM_MUN_SGAB
    description: Código interno del municipio en SGAB. Forma parte de una clave foránea hacia l4_finca.NUM_MUN_SGAB.
    tests:
    - not_null
  - name: NUM_CARRER
    description: Número interno que identifica la vía dentro del municipio. Forma parte de una clave foránea hacia l4_finca.NUM_CARRER.
    tests:
    - not_null
  - name: NUM_INI_FINCA
    description: Número inicial del rango postal que identifica la finca. Forma parte de una clave foránea hacia l4_finca.NUM_INI_FINCA.
    tests:
    - not_null
  - name: COMP_NUM_INI_FINCA
    description: Complemento al número inicial de finca, como letra o sufijo. Forma parte de una clave foránea hacia l4_finca.COMP_NUM_INI_FINCA.
    tests:
    - not_null
  - name: NUM_FIN_FINCA
    description: Número final del rango postal de la finca. Forma parte de una clave foránea hacia l4_finca.NUM_FIN_FINCA.
    tests:
    - not_null
  - name: COMP_NUM_FIN_FINCA
    description: Complemento al número final de finca. Forma parte de una clave foránea hacia l4_finca.COMP_NUM_FIN_FINCA.
    tests:
    - not_null
  - name: SIT_FINCA_ESPEC
    description: Código de situación especial utilizado para diferenciar fincas con la misma numeración. Forma parte de una clave foránea hacia l4_finca.SIT_FINCA_ESPEC.
    tests:
    - not_null
  - name: ORD_FINCA_ESPEC
    description: Ordinal que distingue fincas especiales con igual dirección base. Forma parte de una clave foránea hacia l4_finca.ORD_FINCA_ESPEC.
    tests:
    - not_null
  - name: NUM_ORD_RAMAL
    description: Número ordinal del ramal dentro de la finca.
    tests:
    - not_null
  - name: POLISSA_RAMAL_AFEC
    description: Póliza de otro ramal relacionado o afectado por la operación.
  - name: DNI_NIF_CLIENT_ORI
    description: Documento fiscal del cliente originario asociado al ramal.
  - name: OBS_PRESA_RAMAL
    description: Observaciones sobre la toma o conexión del ramal.
    tests:

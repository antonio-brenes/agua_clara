version: 2
models:
- name: edw_h_municipi_sgab
  description: Hub Data Vault para el maestro municipal de SGAB.
  tests:
  - dbt_utils.unique_combination_of_columns:
      arguments:
        combination_of_columns:
        - NUM_MUN_SGAB
  - key_set_equality:
      arguments:
        compare_model: '{{ ref(''l4_municipi_sgab'') }}'
        model_columns:
        - NUM_MUN_SGAB
        compare_columns:
        - NUM_MUN_SGAB
  columns:
  - name: HK_MUNICIPI_SGAB
    description: Hash business key del municipio.
    data_type: string
    tests:
    - not_null
    - unique
  - name: NUM_MUN_SGAB
    data_type: varchar(2)
    description: Número de municipio de SGAB. Clave primaria.
    tests:
    - not_null
- name: edw_s_municipi_sgab
  description: Satellite del maestro municipal con atributos del municipio.
  tests:
  - dbt_utils.unique_combination_of_columns:
      arguments:
        combination_of_columns:
        - HK_MUNICIPI_SGAB
        - FECHA_CARGA
  columns:
  - name: HK_MUNICIPI_SGAB
    data_type: string
    description: Clave hash del hub.
    tests:
    - not_null
    - relationships:
        arguments:
          to: '{{ ref(''edw_h_municipi_sgab'') }}'
          field: HK_MUNICIPI_SGAB
  - name: NUM_MUN_SGAB
    data_type: varchar(2)
    description: Número de municipio de SGAB. Clave primaria.
    tests:
    - not_null
  - name: NOM_MUN_SGAB
    data_type: varchar(20)
    description: Nombre del municipio de SGAB.
    tests:
    - not_null
  - name: QL_CRITERI_FACT
    data_type: varchar(1)
    description: Criterio de facturación.
  - name: ID_MUN_CP_UNIC
    data_type: varchar(1)
    description: Código postal único del municipio.
  - name: CP_PROVINCIA
    data_type: varchar(2)
    description: Código postal de la provincia.
  - name: UNITAT_REPARTIMENT
    data_type: varchar(1)
    description: Unitad de reparto.
  - name: NUM_DTE_POST
    data_type: varchar(2)
    description: Número de distrito postal.
  - name: NUM_DEL_SGAB
    data_type: varchar(2)
    description: Número de Número de Delegación de SGAB.
  - name: NUM_AGENCIA_SGAB
    data_type: varchar(2)
    description: Número de agencia de SGAB.
  - name: ID_AREA_LECT
    data_type: varchar(1)
    description: Identificador del área de lectura.
  - name: ID_EMPRESA
    data_type: varchar(2)
    description: Identificador de la empresa suministradora.
  - name: DELEGA_CO
    data_type: varchar(1)
    description: Código de delegación.
  - name: QL_GEST_DTE
    data_type: varchar(1)
    description: Gestión de calidad del distrito.
  - name: ID_MUNI_ENT_MET
    data_type: varchar(1)
    description: Indicador de Área Metropolitana de Barcelona.
  - name: NOMB_DIES_ANS
    data_type: number(3,0)
    description: Número de dias de antelación.
  - name: MUNI_GENERALITAT
    data_type: varchar(5)
    description: Municipio de la Generalitat.
  - name: CODI_PROV
    data_type: varchar(2)
    description: Código de la provincia.
  - name: CODI_MUNI
    data_type: varchar(4)
    description: Código del municipio de 4 dígitos, estándar de Explotación Operativa (SGAB).
  - name: QL_TIPUS_VENDA
    data_type: varchar(1)
    description: Calidad del tipo de venta.
  - name: CODI_MUNICIPI
    data_type: varchar(3)
    description: Código del municipio de 3 dígitos, estándar oficial (INE / Idescat).
  - name: NOMB_DIES_INDEMN
    data_type: number(3,0)
    description: Número de días que la empresa debe abonar o compensar al cliente en caso de cortes de servicio no programados que superen el límite legal establecido en el reglamento.
  - name: NOMB_DIES_SENSE_AUT
    data_type: number(2,0)
    description: Número de días sin autorización. Alude a los días en los que un suministro ha estado activo de manera irregular.
  - name: ADHERIT_L24
    data_type: varchar(1)
    description: Adherido a L24 (Ley 24/2015, de 29 de julio, de medidas urgentes para afrontar la emergencia en el ámbito de la vivienda y la pobreza energética).
  - name: CARTA_CIRER
    data_type: varchar(1)
    description: Carta CIRER. Es un modelo de carta de notificación de deuda, siendo la primera carta de aviso de impago que se envía al cliente tras vencer el recibo.
  - name: NUM_CAIPS
    data_type: number(5,0)
    description: Número de CAIPS.
  - name: NUM_DIAS_ENV_CAIPS
    data_type: number(5,0)
    description: Número de días de envío a CAIPS. Número de días de margen que el sistema espera desde que se genera la deuda (o desde la primera notificación) hasta que los datos se
      exportan y envían a la plataforma/proveedor CAIPS (módulo centralizado de gestión de impagos o centro de impresión que emite la notificación física de suspensión).
  - name: CARTA_CIRER_2
    data_type: varchar(1)
    description: Carta CIRER 2. Es un modelo de carta de notificación de deuda, siendo la segunda carta de aviso de impago (frecuentemente la carta certificada o burofax que sirve como
      preaviso legal obligatorio antes de interrumpir el servicio).
  - name: NUM_DIAS_CIRER_2
    data_type: number(5,0)
    description: Número de días de espera entre el primer y el segundo aviso de impago.
  - name: NUM_DIAS_GENERA_CORTE
    data_type: number(5,0)
    description: El plazo legal/operativo en días que debe transcurrir tras las cartas de aviso para que el sistema genere automáticamente la orden física de corte de suministro (suspensión
      por impago).
  - name: ID_CARGA
    data_type: number
    description: Identificador técnico del lote o ejecución que incorporó el registro.
    tests:
    - not_null
  - name: FECHA_EXTRACCION
    data_type: timestamp_tz
    description: Fecha de extracción del registro en RAW.
    tests:
    - not_null
  - name: FECHA_CARGA
    data_type: timestamp_tz
    description: Fecha y hora de carga normalizada a Europe/Madrid.
    tests:
    - not_null
  - name: SISTEMA_ORIGEN
    data_type: varchar(30)
    description: Sistema de origen heredado de RAW.
    tests:
    - not_null
  - name: TABLA_ORIGEN
    data_type: varchar(50)
    description: Tabla RAW de procedencia.
    tests:
    - not_null
  - name: HASHDIFF
    data_type: string
    description: Hash de cambios de los atributos del satélite.
    tests:
    - not_null

      description: Turno mensual de lectura asignado a la finca; permite derivar el ciclo operativo 1, 11 o 21.
    - name: ORD_FINCA_TORN_MEN
      description: Orden de visita de la finca dentro del turno mensual de lectura.
    - name: NUM_DTE_POST_FINCA

version: 2
sources:
- name: raw_sicab
  description: Tablas RAW de origen SICAB para el piloto Agua Clara
  database: des_agua_clara
  schema: raw_sicab
  config:
    loaded_at_field: FECHA_EXTRACCION
    freshness:
      warn_after:
        count: 7
        period: day
      error_after:
        count: 15
        period: day
  tables:
  - name: raw_carrer
    description: 'Maestro de vías públicas de los municipios gestionados. Granularidad: un registro por combinación de municipio
      SGAB y número de calle.'
    columns:
    - name: NUM_MUN_SGAB
      description: Código interno del municipio en SGAB. Forma parte de la clave primaria. Forma parte de una clave foránea hacia l4_municipi_sgab.NUM_MUN_SGAB.
    - name: NUM_CARRER
      description: Número interno que identifica la vía dentro del municipio. Forma parte de la clave primaria.
    - name: CLASSE_CARRER
      description: Clase o categoría administrativa de la vía.
    - name: NOM_ABREUJ_CARRER
      description: Nombre abreviado de la vía, destinado a formatos de espacio limitado.
    - name: TIP_DENOMIN_CARRER
      description: Tipo de denominación de la vía, como calle, avenida o paseo.
    - name: NOM_COMPLET_CARRER
      description: Nombre completo normalizado de la vía.
    - name: ID_CARRER_SAP
      description: Identificador equivalente de la vía en SAP.
    - name: QL_CARRER
      description: Indicador de calidad, validez o tratamiento del registro de calle.
    - name: FECHA_EXTRACCION
      description: Fecha de extracción del registro en RAW.
    - name: SISTEMA_ORIGEN
      description: Sistema de origen del registro RAW.
  - name: raw_codificacions
    description: "Maestro de códigos. Granularidad: un registro por código."
    columns:
    - name: TIP_CODI
      description: Tipo de código. Parte de la clave primaria.
    - name: CLAU_CODI
      description: Clave de código. Parte de la clave primaria.
    - name: DESC_CODI
      description: "Descripción completa del código."
    - name: DESC_BREU
      description: Descripción breve del código.
    - name: FECHA_EXTRACCION
      description: Fecha de extracción del registro en RAW.
    - name: SISTEMA_ORIGEN
      description: Sistema de origen del registro RAW.
  - name: raw_conveni_frau
    description: 'Relación vigente de suministros declarados en situación de fraude, con la dirección y el ramal afectados.
      Granularidad: un registro por póliza de suministro.'
    columns:
    - name: POLISSA_SUBM
      description: Identificador único de la póliza de suministro. Forma parte de la clave primaria. Forma parte de una clave
        foránea hacia l4_submin_servei.POLISSA_SUBM.
    - name: NUM_MUN_CONV_FRAU
      description: Código del municipio donde se localiza el fraude. Forma parte de una clave foránea hacia l4_municipi_sgab.NUM_MUN_SGAB.
    - name: ADRE_CONV_FRAU
      description: Dirección textual normalizada del suministro fraudulento, derivada de calle, finca y unidad del suministro.
    - name: COD_POST_CONV_FRAU
      description: Código postal de la dirección asociada al fraude.
    - name: DEL_CREACIO_CONV_F
      description: Delegación que creó o registró el convenio de fraude.
    - name: DATA_CREA_C_FRA
      description: Fecha desde la que el suministro se considera incluido en la situación de fraude.
    - name: POLISSA_RAMAL
      description: Identificador de la póliza de ramal o acometida. Forma parte de una clave foránea hacia l4_ramal.POLISSA_RAMAL.
    - name: FECHA_EXTRACCION
      description: Fecha de extracción del registro en RAW.
    - name: SISTEMA_ORIGEN
      description: Sistema de origen del registro RAW.
  - name: raw_dte_municipal
    description: 'Maestro de distritos o demarcaciones municipales. Granularidad: un registro por combinación de municipio
      SGAB y distrito municipal.'
    columns:
    - name: NUM_MUN_SGAB
      description: Código interno del municipio en SGAB. Forma parte de la clave primaria. Forma parte de una clave foránea
        hacia l4_municipi_sgab.NUM_MUN_SGAB.
    - name: NUM_DTE_MUNI
      description: Código del distrito o demarcación dentro del municipio. Forma parte de la clave primaria.
    - name: NOM_DTE_MUNI
      description: Nombre descriptivo del distrito o demarcación municipal.
    - name: NUM_DEL_SGAB
      description: Código de la delegación SGAB responsable.
    - name: NUM_AGENCIA_SGAB
      description: Código de la agencia SGAB responsable.
    - name: CODI_AREA_SD
      description: Código del área de servicio o distribución asignada al distrito.
    - name: FECHA_EXTRACCION
      description: Fecha de extracción del registro en RAW.
    - name: SISTEMA_ORIGEN
      description: Sistema de origen del registro RAW.
  - name: raw_epigraf_iae
    description: 'Catálogo de epígrafes del Impuesto sobre Actividades Económicas utilizados para clasificar la actividad
      del suministro y parametrizar tarifas y tasas. Granularidad: un registro por sección y epígrafe IAE.'
    columns:
    - name: SECCIO
      description: Sección de actividad económica que agrupa el epígrafe IAE. Forma parte de la clave primaria.
    - name: EPIGRAF_IAE
      description: Código del epígrafe IAE que identifica la actividad económica. Forma parte de la clave primaria.
    - name: DESCR_IAE
      description: Descripción de la actividad económica correspondiente al epígrafe IAE.
    - name: TIP_TARIFA
      description: Código de tipo de tarifa asociado a la actividad económica.
    - name: TIP_QUOTA_TAMGREM
      description: Tipo de cuota TAMGREM aplicable a la actividad o padrón.
    - name: NIV_GEN_RES
      description: Nivel de generación de residuos asignado a la actividad.
    - name: COD_GEN_RES
      description: Código de categoría de generación de residuos.
    - name: FECHA_EXTRACCION
      description: Fecha de extracción del registro en RAW.
    - name: SISTEMA_ORIGEN
      description: Sistema de origen del registro RAW.
  - name: raw_fact_aigua
    description: 'Detalle técnico y económico de agua asociado a una factura, incluyendo contador, cuota de servicio, bloques
      de consumo, cánones, saneamiento e impuestos. Granularidad: un registro por partición y factura.'
    columns:
    - name: NUM_PARTICIO
      description: Número de partición técnica utilizado para distribuir o localizar físicamente la factura. Forma parte de
        la clave primaria.
    - name: ID_EMPRESA
      description: Código de la empresa emisora o suministradora. Forma parte de la clave primaria. Forma parte de una clave
        foránea hacia l4_fact_resum.ID_EMPRESA.
    - name: ANY_FACTURA
      description: Año de emisión que forma parte de la identificación de la factura. Forma parte de la clave primaria. Forma
        parte de una clave foránea hacia l4_fact_resum.ANY_FACTURA.
    - name: NUM_FACTURA
      description: Número secuencial de la factura dentro de la empresa y año. Forma parte de la clave primaria. Forma parte
        de una clave foránea hacia l4_fact_resum.NUM_FACTURA.
    - name: DIAM_COMP_FACT
      description: Diámetro del contador principal considerado en la factura.
    - name: DIAM_COMP_SEC_FACT
      description: Diámetro del contador secundario considerado en la factura.
    - name: MARCA_COMP_FACT
      description: Código de marca del contador facturado.
    - name: NUM_COMP_FACT
      description: Número de serie o identificador del contador facturado.
    - name: PROPIETAT_COMP_FA
      description: Indicador de propiedad del contador en el momento de facturación.
    - name: CABAL_NOMINAL_CTE
      description: Caudal nominal contratado utilizado para calcular la cuota de servicio.
    - name: IMP_QTA_SERV
      description: Importe de la cuota fija de servicio.
    - name: PREU_M3_BLOC1_FACT
      description: Precio unitario por m³ aplicado al bloque tarifario 1 en la factura.
    - name: IMP_BLOC1
      description: Importe calculado para el bloque tarifario 1 de la factura.
    - name: PREU_M3_BLOC2_FACT
      description: Precio unitario por m³ aplicado al bloque tarifario 2 en la factura.
    - name: IMP_BLOC2
      description: Importe calculado para el bloque tarifario 2 de la factura.
    - name: PREU_M3_BLOC3_FACT
      description: Precio unitario por m³ aplicado al bloque tarifario 3 en la factura.
    - name: IMP_BLOC3
      description: Importe calculado para el bloque tarifario 3 de la factura.
    - name: TIP_CT_XBASICA_FAC
      description: Tipo de cálculo aplicado a la cuota o canon de tarifa básica en la factura.
    - name: BASE_CT_XBASICA
      description: Base de cálculo del concepto de cuota o canon de tarifa básica en la factura.
    - name: PREU_CT_XBASICA_FA
      description: Precio unitario del concepto de cuota o canon de tarifa básica en la factura.
    - name: IMP_CT_XBASICA
      description: Importe del concepto de cuota o canon de tarifa básica en la factura.
    - name: TIP_TCG_SUBM_FACT
      description: Tipo de cálculo del concepto de tarifa o canon general del suministro en la factura.
    - name: BASE_TCG_SUBM
      description: Base de cálculo del concepto de tarifa o canon general del suministro en la factura.
    - name: PREU_TCG_SUBM_FACT
      description: Precio unitario del concepto de tarifa o canon general del suministro en la factura.
    - name: IMP_TCG_SUBM
      description: Importe del concepto de tarifa o canon general del suministro en la factura.
    - name: TIP_CLAVAG_FACT
      description: Tipo de cálculo del concepto de alcantarillado en la factura.
    - name: BASE_CLAVAG
      description: Base de cálculo del concepto de alcantarillado en la factura.
    - name: PREU_CLAVAG_FACT
      description: Precio unitario del concepto de alcantarillado en la factura.
    - name: IMP_CLAVAG
      description: Importe del concepto de alcantarillado en la factura.
    - name: TIP_SANEJA_FACT
      description: Tipo de cálculo del concepto de saneamiento en la factura.
    - name: BASE_SANEJA
      description: Base de cálculo del concepto de saneamiento en la factura.
    - name: PREU_SANEJA_FACT
      description: Precio unitario del concepto de saneamiento en la factura.
    - name: IMP_SANEJA
      description: Importe del concepto de saneamiento en la factura.
    - name: BASE_IVA_SANEJA
      description: Base imponible de IVA correspondiente al saneamiento.
    - name: IMP_IVA_SANEJA
      description: Importe de IVA correspondiente al saneamiento.
    - name: BASE_IVA
      description: Base imponible general sometida a IVA.
    - name: PERCENT_IVA_FACT
      description: Porcentaje de IVA aplicado a la factura.
    - name: IMP_IVA
      description: Importe de IVA calculado sobre la base imponible.
    - name: TIP_ERSU_FACT
      description: Tipo de cálculo del concepto de residuos urbanos en la factura.
    - name: BASE_ERSU
      description: Base de cálculo del concepto de residuos urbanos en la factura.
    - name: PREU_ERSU_FACT
      description: Precio unitario del concepto de residuos urbanos en la factura.
    - name: IMP_ERSU
      description: Importe del concepto de residuos urbanos en la factura.
    - name: TIP_CIH_FACT
      description: Tipo de cálculo del canon o componente de infraestructura hidráulica aplicado en la factura.
    - name: BASE_CIH_BLOC1
      description: Base de cálculo del CIH para el bloque 1 en la factura.
    - name: PREU_CIH_BLOC1_FA
      description: Precio unitario del CIH para el bloque 1 en la factura.
    - name: IMP_CIH_BLOC1
      description: Importe del CIH para el bloque 1 en la factura.
    - name: BASE_CIH_BLOC2
      description: Base de cálculo del CIH para el bloque 2 en la factura.
    - name: PREU_CIH_BLOC2_FA
      description: Precio unitario del CIH para el bloque 2 en la factura.
    - name: IMP_CIH_BLOC2
      description: Importe del CIH para el bloque 2 en la factura.
    - name: BASE_CIH_BLOC3
      description: Base de cálculo del CIH para el bloque 3 en la factura.
    - name: PREU_CIH_BLOC3_FA
      description: Precio unitario del CIH para el bloque 3 en la factura.
    - name: IMP_CIH_BLOC3
      description: Importe del CIH para el bloque 3 en la factura.
    - name: CABAL_CTE
      description: Caudal contratado utilizado en cálculos tarifarios.
    - name: COEF_CIH_IND_FAC
      description: Coeficiente industrial aplicado al canon o infraestructura hidráulica.
    - name: QL_1999_2000
      description: Indicador legado asociado al tratamiento tarifario del cambio 1999-2000.
    - name: NOMBRE_PERSONES
      description: Número de personas considerado en el cálculo de tramos.
    - name: LIMIT_TRAM1_FACT
      description: Límite de consumo utilizado en la factura para el tramo 1.
    - name: LIMIT_TRAM2_FACT
      description: Límite de consumo utilizado en la factura para el tramo 2.
    - name: LIMIT_CAI1_FACT
      description: Límite de consumo utilizado en la factura para el tramo de canon 1.
    - name: LIMIT_CLAV1_FACT
      description: Límite de consumo utilizado en la factura para el primer tramo de alcantarillado.
    - name: LIMIT_CAI2_FACT
      description: Límite de consumo utilizado en la factura para el tramo de canon 2.
    - name: NOMBRE_PER_CAI
      description: Número de personas considerado para los límites del canon del agua.
    - name: NOMBRE_PER_TMTR
      description: Número de personas considerado para la tasa metropolitana de residuos.
    - name: NUM_COMPT_T_FACT
      description: Identificador del contador totalizador considerado en la factura.
    - name: PREU_M3_BLOC4_FACT
      description: Precio unitario por m³ aplicado al bloque tarifario 4 en la factura.
    - name: IMP_BLOC4
      description: Importe calculado para el bloque tarifario 4 de la factura.
    - name: PREU_M3_BLOC5_FACT
      description: Precio unitario por m³ aplicado al bloque tarifario 5 en la factura.
    - name: IMP_BLOC5
      description: Importe calculado para el bloque tarifario 5 de la factura.
    - name: LIMIT_TRAM3_FACT
      description: Límite de consumo utilizado en la factura para el tramo 3.
    - name: LIMIT_TRAM4_FACT
      description: Límite de consumo utilizado en la factura para el tramo 4.
    - name: LIMIT_CAI3_FACT
      description: Límite de consumo utilizado en la factura para el tramo de canon 3.
    - name: FECHA_EXTRACCION
      description: Fecha de extracción del registro en RAW.
    - name: SISTEMA_ORIGEN
      description: Sistema de origen del registro RAW.
  - name: raw_fact_concepte
    description: 'Detalle de conceptos adicionales o explícitos incluidos en una factura. Granularidad: una línea por partición,
      factura, número de línea y código de concepto.'
    columns:
    - name: NUM_PARTICIO
      description: Número de partición técnica utilizado para distribuir o localizar físicamente la factura. Forma parte de
        la clave primaria.
    - name: ID_EMPRESA
      description: Código de la empresa emisora o suministradora. Forma parte de la clave primaria. Forma parte de una clave
        foránea hacia l4_fact_resum.ID_EMPRESA.
    - name: ANY_FACTURA
      description: Año de emisión que forma parte de la identificación de la factura. Forma parte de la clave primaria. Forma
        parte de una clave foránea hacia l4_fact_resum.ANY_FACTURA.
    - name: NUM_FACTURA
      description: Número secuencial de la factura dentro de la empresa y año. Forma parte de la clave primaria. Forma parte
        de una clave foránea hacia l4_fact_resum.NUM_FACTURA.
    - name: NUM_LINEA
      description: Número secuencial de la línea dentro de la factura. Forma parte de la clave primaria.
    - name: NUM_CONCEPTE
      description: Código del concepto facturado; debe existir en L4_CODIFICACIONS para la familia de conceptos de facturación.
        Forma parte de la clave primaria.
    - name: BASE_CONCEPTE
      description: Cantidad, unidades o base monetaria sobre la que se calcula el concepto.
    - name: TIP_TAXA_CONCEP
      description: Tipo de tarifa o tasa aplicada al concepto.
    - name: PREU_CONCEPTE
      description: Precio unitario o porcentaje aplicado a la base del concepto.
    - name: IMP_CONCEPTE
      description: Importe final de la línea tras aplicar precio, porcentaje y redondeo.
    - name: IVA_APLICAT_CONC
      description: Porcentaje de IVA asociado al concepto.
    - name: OBSER_CONCEPTE
      description: Texto explicativo o detalle de la línea de concepto.
    - name: FECHA_EXTRACCION
      description: Fecha de extracción del registro en RAW.
    - name: SISTEMA_ORIGEN
      description: Sistema de origen del registro RAW.
  - name: raw_fact_resum
    description: 'Cabecera e importe agregado de la factura, con periodo, suministro, cliente, consumo por bloques, cobro
      y atributos de emisión. Granularidad: una factura por empresa, año y número de factura.'
    columns:
    - name: ID_EMPRESA
      description: Código de la empresa emisora o suministradora. Forma parte de la clave primaria.
    - name: ANY_FACTURA
      description: Año de emisión que forma parte de la identificación de la factura. Forma parte de la clave primaria.
    - name: NUM_FACTURA
      description: Número secuencial de la factura dentro de la empresa y año. Forma parte de la clave primaria.
    - name: QL_EMPLEAT_SGAB
      description: Indicador de intervención o tratamiento por personal SGAB.
    - name: FREQ_FACT
      description: Frecuencia de facturación aplicada al periodo.
    - name: M3_BLOC1
      description: Volumen de agua, en m³, asignado al bloque tarifario 1 en la factura.
    - name: M3_BLOC2
      description: Volumen de agua, en m³, asignado al bloque tarifario 2 en la factura.
    - name: M3_BLOC3
      description: Volumen de agua, en m³, asignado al bloque tarifario 3 en la factura.
    - name: M3_BLOC4
      description: Volumen de agua, en m³, asignado al bloque tarifario 4 en la factura.
    - name: M3_BLOC5
      description: Volumen de agua, en m³, asignado al bloque tarifario 5 en la factura.
    - name: IMP_TOTAL_FACT
      description: Importe total final de la factura, incluidos impuestos, conceptos y bonificaciones.
    - name: IMP_AIGUA_IVA
      description: Importe correspondiente al servicio de agua incluido el IVA aplicable.
    - name: ID_RECUPERACIO
      description: Indicador de que la factura incorpora una recuperación de importes.
    - name: ID_REGULARITZACIO
      description: Indicador de que la factura incorpora una regularización.
    - name: DATA_CARREC_RECAP
      description: Fecha de cargo o transferencia de la factura al sistema de recaudación.
    - name: IDEN_LOT_LECT_FACT
      description: Identificador del lote de lectura utilizado para facturar.
    - name: NUM_PARTICIO
      description: Número de partición técnica utilizado para distribuir o localizar físicamente la factura. Forma parte de la clave primaria.
    - name: POLISSA_SUBM
      description: Identificador único de la póliza de suministro. Forma parte de una clave foránea hacia l4_submin_servei.POLISSA_SUBM.
    - name: DATA_FIN_FACT
      description: Fecha final incluida en el periodo de facturación.
    - name: ID_LOT_FACT
      description: Identificador del lote de proceso o emisión de facturación.
    - name: ANY_CALENDARI
      description: Año del calendario de facturación, expresado con dos dígitos.
    - name: MES_CALENDARI
      description: Mes del calendario de facturación, expresado con dos dígitos.
    - name: ID_CONCEPTES
      description: Indicador de existencia de líneas adicionales en L4_FACT_CONCEPTE.
    - name: ID_DECLARADA
      description: Indicador de factura declarada o comunicada al proceso correspondiente.
    - name: DNI_NIF_CLIENT
      description: Documento identificativo fiscal del cliente o titular.
    - name: QL_GESTIO_FACT
      description: Indicador de modalidad o calidad de gestión de la factura.
    - name: QL_TIP_COBRA
      description: Tipo o modalidad de cobro aplicada a la factura.
    - name: NUM_ENTITAT_COBR
      description: Código de entidad bancaria utilizado en la factura.
    - name: NUM_AGENCIA_APAR
      description: Código de oficina bancaria utilizado en la factura.
    - name: NUM_COMPTE_DEPEN
      description: Número de cuenta dependiente utilizado para el cobro.
    - name: DVER_COMPTE_BANC
      description: Dígitos verificadores de la cuenta bancaria.
    - name: TIP_FACTURA
      description: Código de clase o modalidad de factura.
    - name: DATA_EMISS_FACT
      description: Fecha de emisión de la factura.
    - name: DATA_INI_FACT
      description: Fecha inicial incluida en el periodo facturado.
    - name: QL_RESUM_COMPTABLE
      description: Indicador de inclusión o tratamiento en el resumen contable.
    - name: TIP_QTA_SERV_FACT
      description: Tipo de cuota de servicio aplicada en la factura.
    - name: ID_CALCUL_DIARI
      description: Indicador de cálculo proporcional por días.
    - name: US_AIGUA_SUBM_FACT
      description: Uso del agua vigente y congelado en el momento de la factura.
    - name: TIP_HABIT_SUBM_FA
      description: Tipo de vivienda vigente y congelado en el momento de la factura.
    - name: NOMB_HABIT_FACT
      description: Número de habitantes considerado para tramos y bonificaciones en la factura.
    - name: SIT_SUBM_SERV_FACT
      description: Situación del suministro congelada en la fecha de factura.
    - name: QL_IDIOMA_FACT
      description: Idioma utilizado para emitir la factura.
    - name: PUBLI_OFI_TARI_FA
      description: Referencia de publicación oficial de la tarifa aplicada.
    - name: ID_CARREC_SOCIETAT
      description: Indicador de cargo gestionado por la sociedad.
    - name: QL_MONEDA
      description: Código o indicador de la moneda de facturación.
    - name: TIP_SUBM_SERV
      description: 'Tipo de suministro o servicio: D doméstico, I industrial y C contra incendios en el piloto.'
    - name: NOM_CLIENT
      description: Nombre del cliente impreso o registrado en la factura.
    - name: NUM_INDEX
      description: Número o referencia de índice asociada a la lectura o cálculo.
    - name: APROVADA_FACT
      description: Marca o referencia de aprobación de la factura.
    - name: QL_TIP_COBRA_INI
      description: Tipo de cobro inicial antes de cambios posteriores.
    - name: QL_ENVIO_FACT
      description: Indicador del canal o estado de envío de la factura.
    - name: TIP_DOMESTIC
      description: Subtipología doméstica aplicada a la factura.
    - name: QL_DCL_CAI
      description: Indicador de declaración del canon del agua.
    - name: TIP_FACT_ENV
      description: Modalidad o formato de envío de la factura.
    - name: EMISSORA
      description: Código de la entidad o sistema emisor.
    - name: NUM_COMPTE_IBAN
      description: Número de cuenta bancaria en formato IBAN.
    - name: TIP_FACT_SII
      description: Tipo de factura utilizado para el Suministro Inmediato de Información.
    - name: TIPUS_FACTURA
      description: Clasificación adicional de la factura, incluida la identificación de facturas sustitutivas.
    - name: FECHA_EXTRACCION
      description: Fecha de extracción del registro en RAW.
    - name: SISTEMA_ORIGEN
      description: Sistema de origen del registro RAW.
  - name: raw_finca
    description: 'Maestro de fincas o rangos de numeración postal, con atributos territoriales, técnicos y de planificación

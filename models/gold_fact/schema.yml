version: 2
models:
- name: g_d_fecha
  description: 'Dimensión calendario conformada y continua. Granularidad: una fila por día natural desde 2020-01-01 hasta 2026-12-31. Está diseñada
    para analizar los hechos Gold por fecha de emisión, inicio y fin de periodo, cargo, situación e incidencia. Power BI puede crear relaciones
    de rol activas o inactivas según la perspectiva analítica.'
  config:
    materialized: table
    meta:
      layer: gold_fact
      entity_type: dimension
      grain: una fila por fecha
  columns:
  - name: FECHA
    data_type: date
    description: Fecha de calendario y clave natural de la dimensión.
    tests:
    - not_null
    - unique
  - name: ANYO
    data_type: number(4,0)
    description: Año natural de la fecha.
    tests:
    - not_null
  - name: MES
    data_type: number(2,0)
    description: Número de mes natural entre 1 y 12.
    tests:
    - not_null
  - name: MES_NUMERO
    data_type: varchar(2)
    description: Número de mes con dos posiciones, útil para ordenación y presentación.
    tests:
    - not_null
  - name: NOMBRE_MES
    data_type: varchar
    description: Nombre abreviado del mes devuelto por Snowflake.
  - name: ANYO_MES
    data_type: varchar(6)
    description: Clave cronológica año-mes con formato YYYYMM, apta para ordenar periodos mensuales.
    tests:
    - not_null
  - name: MES_ANYO
    data_type: varchar(7)
    description: Etiqueta mensual con formato MM/YYYY para visualización.
    tests:
    - not_null
  - name: TRIMESTRE
    data_type: number(1,0)
    description: Trimestre natural entre 1 y 4.
    tests:
    - not_null
  - name: DIA
    data_type: number(2,0)
    description: Día del mes.
    tests:
    - not_null
  - name: DIA_SEMANA
    data_type: number(1,0)
    description: 'Número ISO del día de la semana: 1 lunes y 7 domingo.'
    tests:
    - not_null
  - name: NOMBRE_DIA
    data_type: varchar
    description: Nombre abreviado del día de la semana.
  - name: SEMANA_ISO
    data_type: number(2,0)
    description: Número de semana según calendario ISO.
    tests:
    - not_null
  - name: ANYO_SEMANA
    data_type: varchar(6)
    description: Clave año-semana ISO con formato YYYYWw sin separador.
    tests:
    - not_null
  - name: DIA_ANYO
    data_type: number(3,0)
    description: Número ordinal del día dentro del año.
    tests:
    - not_null
  - name: ES_FIN_SEMANA
    data_type: boolean
    description: Indicador de sábado o domingo.
    tests:
    - not_null
  - name: ES_LABORABLE
    data_type: boolean
    description: Indicador simplificado de día laborable para el piloto. Es verdadero cuando ES_FIN_SEMANA es falso; no contempla festivos.
    tests:
    - not_null
  - name: INICIO_MES
    data_type: date
    description: Primer día del mes de FECHA.
    tests:
    - not_null
  - name: FIN_MES
    data_type: date
    description: Último día del mes de FECHA.
    tests:
    - not_null
  - name: INICIO_TRIMESTRE
    data_type: date
    description: Primer día del trimestre de FECHA.
    tests:
    - not_null
  - name: FIN_TRIMESTRE
    data_type: date
    description: Último día del trimestre de FECHA.
    tests:
    - not_null
  - name: ID_CARGA
    data_type: number
    description: Identificador técnico del lote heredado de la fuente CALENDARIO_GENERADO. Para miembros desconocidos o filas generadas en Gold
      se informa con un valor técnico controlado.
    tests:
    - not_null
  - name: FECHA_EXTRACCION
    data_type: timestamp_tz
    description: Fecha y hora de extracción heredada de la fuente CALENDARIO_GENERADO. Puede ser nula únicamente en miembros técnicos generados
      directamente en Gold.
  - name: FECHA_CARGA
    data_type: timestamp_tz
    description: Fecha y hora de materialización del registro en Gold, calculada con la fecha del sistema en la zona horaria Europe/Madrid.
    tests:
    - not_null
  - name: SISTEMA_ORIGEN
    data_type: varchar(30)
    description: Sistema de origen heredado de CALENDARIO_GENERADO. Para miembros técnicos generados en Gold se informa como GOLD.
    tests:
    - not_null
  - name: TABLA_ORIGEN
    data_type: varchar(50)
    description: Tabla Silver principal utilizada como fuente inmediata del registro Gold. Para filas técnicas generadas se conserva el nombre
      lógico de la fuente o del proceso generador.
    tests:
    - not_null
- name: g_d_cliente
  description: 'Dimensión conformada de clientes identificados en la facturación. Granularidad: una fila por documento fiscal DNI_NIF_CLIENT,
    más un miembro desconocido estable. Consolida el nombre facturado y los atributos básicos de cliente disponibles en Silver. La relación con
    el suministro se realiza mediante HK_CLIENTE en g_d_suministro.'
  config:
    materialized: table
    meta:
      layer: gold_fact
      entity_type: dimension
      grain: una fila por cliente
  columns:
  - name: HK_CLIENTE
    data_type: string
    description: Clave técnica estable del cliente calculada a partir de DNI_NIF_CLIENT. El miembro desconocido utiliza una hash determinista
      específica.
    tests:
    - not_null
    - unique
  - name: DNI_NIF_CLIENT
    data_type: varchar(9)
    description: Documento fiscal del cliente. Actúa como clave natural; contiene información sensible y debe protegerse en las vistas de consumo.
    tests:
    - not_null
    - unique
  - name: NOM_CLIENT
    data_type: varchar(35)
    description: Nombre del cliente observado en la factura más reciente seleccionada para la dimensión. Contiene información personal.
  - name: NOM_TITULAR
    data_type: varchar(35)
    description: Nombre normalizado del titular utilizado para análisis de cliente.
  - name: NOM_COMERCIAL
    data_type: varchar(50)
    description: Nombre comercial del cliente cuando está disponible en la fuente.
  - name: ID_CARGA
    data_type: number
    description: Identificador técnico del lote heredado de la fuente S_FACTURA. Para miembros desconocidos o filas generadas en Gold se informa
      con un valor técnico controlado.
    tests:
    - not_null
  - name: FECHA_EXTRACCION
    data_type: timestamp_tz
    description: Fecha y hora de extracción heredada de la fuente S_FACTURA. Puede ser nula únicamente en miembros técnicos generados directamente
      en Gold.
  - name: FECHA_CARGA
    data_type: timestamp_tz
    description: Fecha y hora de materialización del registro en Gold, calculada con la fecha del sistema en la zona horaria Europe/Madrid.
    tests:
    - not_null
  - name: SISTEMA_ORIGEN
    data_type: varchar(30)
    description: Sistema de origen heredado de S_FACTURA. Para miembros técnicos generados en Gold se informa como GOLD.
    tests:
    - not_null
  - name: TABLA_ORIGEN
    data_type: varchar(50)
    description: Tabla Silver principal utilizada como fuente inmediata del registro Gold. Para filas técnicas generadas se conserva el nombre
      lógico de la fuente o del proceso generador.
    tests:
    - not_null
- name: g_d_geografia
  description: 'Dimensión geográfica conformada a grano finca. Granularidad: una fila por HK_FINCA, más un miembro desconocido estable. Reúne
    la finca, calle y municipio relacionados en Silver EDW. g_d_suministro incorpora HK_GEOGRAFIA para navegar desde el suministro hasta la ubicación
    física.'
  config:
    materialized: table
    meta:
      layer: gold_fact
      entity_type: dimension
      grain: una fila por finca
  columns:
  - name: HK_GEOGRAFIA
    data_type: string
    description: Clave técnica de la geografía. Para ubicaciones conocidas coincide con HK_FINCA; el miembro desconocido utiliza una hash determinista.
    tests:
    - not_null
    - unique
  - name: HK_FINCA
    data_type: string
    description: Clave hash de la finca que determina el grano geográfico.
    tests:
    - not_null
  - name: HK_CARRER
    data_type: string
    description: Clave hash de la calle asociada a la finca.
  - name: HK_MUNICIPI_SGAB
    data_type: string
    description: Clave hash del municipio SGAB asociado a la calle.
  - name: NUM_MUN_SGAB
    data_type: varchar(2)
    description: Código interno SGAB del municipio.
  - name: NOM_MUN_SGAB
    data_type: varchar(20)
    description: Nombre del municipio SGAB.
  - name: NUM_CARRER
    data_type: number(6,0)
    description: Número interno de la calle dentro del municipio.
  - name: NOM_COMPLET_CARRER
    data_type: varchar(44)
    description: Nombre completo normalizado de la calle.
  - name: NUM_INI_FINCA
    data_type: varchar(4)
    description: Número inicial del rango postal que identifica la finca.
  - name: COMP_NUM_INI_FINCA
    data_type: varchar(1)
    description: Complemento del número inicial de finca.
  - name: NUM_FIN_FINCA
    data_type: varchar(4)
    description: Número final del rango postal de la finca.
  - name: COMP_NUM_FIN_FINCA
    data_type: varchar(1)
    description: Complemento del número final de finca.
  - name: NUM_DTE_MUNI_FINCA
    data_type: varchar(2)
    description: Código del distrito municipal asociado a la finca.
  - name: ID_CARGA
    data_type: number
    description: Identificador técnico del lote heredado de la fuente EDW_S_FINCA. Para miembros desconocidos o filas generadas en Gold se informa
      con un valor técnico controlado.
    tests:
    - not_null
  - name: FECHA_EXTRACCION
    data_type: timestamp_tz
    description: Fecha y hora de extracción heredada de la fuente EDW_S_FINCA. Puede ser nula únicamente en miembros técnicos generados directamente
      en Gold.
  - name: FECHA_CARGA
    data_type: timestamp_tz
    description: Fecha y hora de materialización del registro en Gold, calculada con la fecha del sistema en la zona horaria Europe/Madrid.
    tests:
    - not_null
  - name: SISTEMA_ORIGEN
    data_type: varchar(30)
    description: Sistema de origen heredado de EDW_S_FINCA. Para miembros técnicos generados en Gold se informa como GOLD.
    tests:
    - not_null
  - name: TABLA_ORIGEN
    data_type: varchar(50)
    description: Tabla Silver principal utilizada como fuente inmediata del registro Gold. Para filas técnicas generadas se conserva el nombre
      lógico de la fuente o del proceso generador.
    tests:
    - not_null
- name: g_d_suministro
  description: 'Dimensión de suministro con la última versión disponible del satélite operativo. Granularidad: una fila por HK_SUBMIN_SERVEI,
    más un miembro desconocido estable. Conserva el tipo y situación actuales del suministro y las claves hacia cliente y geografía. Los atributos
    congelados en fecha de factura permanecen en g_h_factura.'
  config:
    materialized: table
    meta:
      layer: gold_fact
      entity_type: dimension
      grain: una fila por suministro
  columns:
  - name: HK_SUBMIN_SERVEI
    data_type: string
    description: Clave hash del suministro, calculada en Silver EDW a partir de POLISSA_SUBM.
    tests:
    - not_null
    - unique
  - name: POLISSA_SUBM
    data_type: varchar(10)
    description: Identificador natural de la póliza de suministro.
    tests:
    - not_null
    - unique
  - name: HK_CLIENTE
    data_type: string
    description: Clave foránea del cliente asociado actualmente al suministro.
    tests:
    - not_null
    - relationships:
        arguments:
          to: '{{ ref(''g_d_cliente'') }}'
          field: HK_CLIENTE
  - name: HK_GEOGRAFIA
    data_type: string
    description: Clave foránea de la finca o ubicación geográfica asociada al suministro mediante suministro, ramal y finca.
    tests:
    - not_null
    - relationships:
        arguments:
          to: '{{ ref(''g_d_geografia'') }}'
          field: HK_GEOGRAFIA
  - name: TIP_SUBM_SERV
    data_type: varchar(1)
    description: 'Tipo actual del suministro: D doméstico, I industrial o C contra incendios.'
    tests:
    - accepted_values:
        arguments:
          values:
          - D
          - I
          - C
          - DESCONOCIDO
  - name: SIT_SUBM_SERV
    data_type: varchar(1)
    description: Situación operativa actual del suministro.
  - name: US_AIGUA_SUBM
    data_type: varchar(1)
    description: Código actual de uso del agua del suministro.
  - name: TIP_HABIT_SUBM
    data_type: varchar(1)
    description: Tipo actual de vivienda asociado al suministro.
  - name: NOMB_HABIT_SUBM
    data_type: number(3,0)
    description: Número actual de habitantes asociado al suministro.
  - name: DNI_NIF_CLIENT
    data_type: varchar(9)
    description: Documento fiscal del cliente asociado al suministro. Se conserva para trazabilidad; contiene información sensible.
  - name: ID_QUOTA_SOCIAL
    data_type: varchar(1)
    description: Indicador actual de cuota social.
  - name: ID_TARIFA_SOCIAL
    data_type: varchar(1)
    description: Indicador actual de tarifa social.
  - name: IND_SERVEI_SOCIAL
    data_type: varchar(1)
    description: Indicador actual de intervención o reconocimiento por servicios sociales.
  - name: IND_POB_ENERG
    data_type: varchar(1)
    description: Indicador actual de pobreza energética.
  - name: ID_CARGA
    data_type: number
    description: Identificador técnico del lote heredado de la fuente EDW_S_SUBMIN_SERVEI. Para miembros desconocidos o filas generadas en Gold
      se informa con un valor técnico controlado.
    tests:
    - not_null
  - name: FECHA_EXTRACCION
    data_type: timestamp_tz
    description: Fecha y hora de extracción heredada de la fuente EDW_S_SUBMIN_SERVEI. Puede ser nula únicamente en miembros técnicos generados
      directamente en Gold.
  - name: FECHA_CARGA
    data_type: timestamp_tz
    description: Fecha y hora de materialización del registro en Gold, calculada con la fecha del sistema en la zona horaria Europe/Madrid.
    tests:
    - not_null
  - name: SISTEMA_ORIGEN
    data_type: varchar(30)
    description: Sistema de origen heredado de EDW_S_SUBMIN_SERVEI. Para miembros técnicos generados en Gold se informa como GOLD.
    tests:
    - not_null
  - name: TABLA_ORIGEN
    data_type: varchar(50)
    description: Tabla Silver principal utilizada como fuente inmediata del registro Gold. Para filas técnicas generadas se conserva el nombre
      lógico de la fuente o del proceso generador.
    tests:
    - not_null
- name: g_d_tipo_suministro
  description: 'Dimensión de negocio para los tipos de suministro del catálogo TSS. Granularidad: una fila por HK_TIPO_SUMINISTRO, más un miembro
    desconocido estable. Se relaciona directamente con el tipo de suministro congelado en g_h_factura para filtrar la facturación por la clasificación
    vigente en el momento de emisión.'
  config:
    materialized: table
    meta:
      layer: gold_fact
      entity_type: dimension
      grain: una fila por tipo de suministro
  columns:
  - name: HK_TIPO_SUMINISTRO
    data_type: string
    description: Clave hash del tipo de suministro.
    tests:
    - not_null
    - unique
  - name: COD_TIPO_SUMINISTRO
    data_type: varchar
    description: Código funcional del tipo de suministro.
    tests:
    - not_null
    - unique
  - name: DES_TIPO_SUMINISTRO
    data_type: varchar
    description: Descripción completa del tipo de suministro.
    tests:
    - not_null
  - name: DES_ABREV_TIPO_SUMINISTRO
    data_type: varchar
    description: Descripción abreviada del tipo de suministro.
  - name: ID_CARGA
    data_type: number
    description: Identificador técnico del lote heredado de la fuente EDW_S_TIPO_SUMINISTRO. Para miembros desconocidos o filas generadas en Gold
      se informa con un valor técnico controlado.
    tests:
    - not_null
  - name: FECHA_EXTRACCION
    data_type: timestamp_tz
    description: Fecha y hora de extracción heredada de la fuente EDW_S_TIPO_SUMINISTRO. Puede ser nula únicamente en miembros técnicos generados
      directamente en Gold.
  - name: FECHA_CARGA
    data_type: timestamp_tz
    description: Fecha y hora de materialización del registro en Gold, calculada con la fecha del sistema en la zona horaria Europe/Madrid.
    tests:
    - not_null
  - name: SISTEMA_ORIGEN
    data_type: varchar(30)
    description: Sistema de origen heredado de EDW_S_TIPO_SUMINISTRO. Para miembros técnicos generados en Gold se informa como GOLD.
    tests:
    - not_null
  - name: TABLA_ORIGEN
    data_type: varchar(50)
    description: Tabla Silver principal utilizada como fuente inmediata del registro Gold. Para filas técnicas generadas se conserva el nombre
      lógico de la fuente o del proceso generador.
    tests:
    - not_null
- name: g_d_situacion_factura
  description: 'Dimensión de situaciones de factura procedente del catálogo R01 de Silver Fact. Granularidad: una fila por situación, más un miembro
    desconocido estable. Permite describir los eventos de g_h_factura_situacion.'
  config:
    materialized: table
    meta:
      layer: gold_fact
      entity_type: dimension
      grain: una fila por situacion de factura
  columns:
  - name: HK_SITUACION_FACT
    data_type: string
    description: Clave hash de la situación de factura.
    tests:
    - not_null
    - unique
  - name: TIP_SIT_FACT
    data_type: varchar(2)
    description: Código funcional de la situación de factura.
    tests:
    - not_null
    - unique
  - name: DESC_SITUACION
    data_type: varchar
    description: Descripción completa de la situación.
    tests:
    - not_null
  - name: DESC_BREU_SITUACION
    data_type: varchar
    description: Descripción breve de la situación.
  - name: ID_CARGA
    data_type: number
    description: Identificador técnico del lote heredado de la fuente S_SITUACION_FACTURA. Para miembros desconocidos o filas generadas en Gold
      se informa con un valor técnico controlado.
    tests:
    - not_null
  - name: FECHA_EXTRACCION
    data_type: timestamp_tz
    description: Fecha y hora de extracción heredada de la fuente S_SITUACION_FACTURA. Puede ser nula únicamente en miembros técnicos generados
      directamente en Gold.
  - name: FECHA_CARGA
    data_type: timestamp_tz
    description: Fecha y hora de materialización del registro en Gold, calculada con la fecha del sistema en la zona horaria Europe/Madrid.
    tests:
    - not_null
  - name: SISTEMA_ORIGEN
    data_type: varchar(30)
    description: Sistema de origen heredado de S_SITUACION_FACTURA. Para miembros técnicos generados en Gold se informa como GOLD.
    tests:
    - not_null
  - name: TABLA_ORIGEN
    data_type: varchar(50)
    description: Tabla Silver principal utilizada como fuente inmediata del registro Gold. Para filas técnicas generadas se conserva el nombre
      lógico de la fuente o del proceso generador.
    tests:
    - not_null
- name: g_d_actividad_economica
  description: 'Dimensión conformada de actividad económica basada en los epígrafes IAE. Granularidad: una fila por HK_EPIGRAF_IAE, más un miembro
    desconocido estable. Se relaciona con los suministros mediante g_b_suministro_actividad.'
  config:
    materialized: table
    meta:
      layer: gold_fact
      entity_type: dimension
      grain: una fila por actividad economica
  columns:
  - name: HK_ACTIVIDAD_ECONOMICA
    data_type: string
    description: Clave técnica Gold de la actividad económica; para registros conocidos coincide con HK_EPIGRAF_IAE.
    tests:
    - not_null
    - unique
  - name: HK_EPIGRAF_IAE
    data_type: string
    description: Clave hash del epígrafe IAE de Silver EDW.
    tests:
    - not_null
  - name: SECCIO
    data_type: varchar(1)
    description: Sección que agrupa el epígrafe IAE.
  - name: EPIGRAF_IAE
    data_type: varchar(4)
    description: Código del epígrafe IAE.
  - name: DESCR_IAE
    data_type: varchar(50)
    description: Descripción de la actividad económica.
  - name: TIP_TARIFA
    data_type: varchar(1)
    description: Código de tipo de tarifa asociado a la actividad.
  - name: TIP_QUOTA_TAMGREM
    data_type: varchar(3)
    description: Tipo de cuota TAMGREM asociado a la actividad.
  - name: NIV_GEN_RES
    data_type: varchar(1)
    description: Nivel de generación de residuos.
  - name: COD_GEN_RES
    data_type: varchar(1)
    description: Código de categoría de generación de residuos.
  - name: ID_CARGA
    data_type: number
    description: Identificador técnico del lote heredado de la fuente EDW_S_EPIGRAF_IAE. Para miembros desconocidos o filas generadas en Gold
      se informa con un valor técnico controlado.
    tests:
    - not_null
  - name: FECHA_EXTRACCION
    data_type: timestamp_tz
    description: Fecha y hora de extracción heredada de la fuente EDW_S_EPIGRAF_IAE. Puede ser nula únicamente en miembros técnicos generados
      directamente en Gold.
  - name: FECHA_CARGA
    data_type: timestamp_tz
    description: Fecha y hora de materialización del registro en Gold, calculada con la fecha del sistema en la zona horaria Europe/Madrid.
    tests:
    - not_null
  - name: SISTEMA_ORIGEN
    data_type: varchar(30)
    description: Sistema de origen heredado de EDW_S_EPIGRAF_IAE. Para miembros técnicos generados en Gold se informa como GOLD.
    tests:
    - not_null
  - name: TABLA_ORIGEN
    data_type: varchar(50)
    description: Tabla Silver principal utilizada como fuente inmediata del registro Gold. Para filas técnicas generadas se conserva el nombre
      lógico de la fuente o del proceso generador.
    tests:
    - not_null
- name: g_d_colectivo
  description: 'Dimensión conformada de colectivos sociales observados en el histórico de servicios sociales y pobreza energética. Granularidad:
    una fila por TIP_COLECTIVO, más un miembro desconocido estable. Los periodos de pertenencia se mantienen en g_b_suministro_colectivo.'
  config:
    materialized: table
    meta:
      layer: gold_fact
      entity_type: dimension
      grain: una fila por colectivo social
  columns:
  - name: HK_COLECTIVO
    data_type: string
    description: Clave técnica estable calculada a partir de TIP_COLECTIVO.
    tests:
    - not_null
    - unique
  - name: TIP_COLECTIVO
    data_type: varchar(2)
    description: Código funcional del colectivo social.
    tests:
    - not_null
    - unique
  - name: DESC_COLECTIVO
    data_type: varchar
    description: Descripción de presentación del colectivo social.
    tests:
    - not_null
  - name: ID_CARGA
    data_type: number
    description: Identificador técnico del lote heredado de la fuente EDW_S_HIST_SS_PE. Para miembros desconocidos o filas generadas en Gold se
      informa con un valor técnico controlado.
    tests:
    - not_null
  - name: FECHA_EXTRACCION
    data_type: timestamp_tz
    description: Fecha y hora de extracción heredada de la fuente EDW_S_HIST_SS_PE. Puede ser nula únicamente en miembros técnicos generados directamente
      en Gold.
  - name: FECHA_CARGA
    data_type: timestamp_tz
    description: Fecha y hora de materialización del registro en Gold, calculada con la fecha del sistema en la zona horaria Europe/Madrid.
    tests:
    - not_null
  - name: SISTEMA_ORIGEN
    data_type: varchar(30)
    description: Sistema de origen heredado de EDW_S_HIST_SS_PE. Para miembros técnicos generados en Gold se informa como GOLD.
    tests:
    - not_null
  - name: TABLA_ORIGEN
    data_type: varchar(50)
    description: Tabla Silver principal utilizada como fuente inmediata del registro Gold. Para filas técnicas generadas se conserva el nombre
      lógico de la fuente o del proceso generador.
    tests:
    - not_null
- name: g_d_concepto
  description: 'Dimensión conformada de conceptos económicos de factura. Granularidad: una fila por CODIGO_CONCEPTO, más un miembro desconocido
    estable. Unifica componentes verticalizados de agua, prefijados con AIGUA:, y conceptos explícitos, prefijados con CONCEPTE:. La clasificación
    funcional procede de la seed g_s_concepto_clasificacion.'
  config:
    materialized: table
    meta:
      layer: gold_fact
      entity_type: dimension
      grain: una fila por concepto conformado
  columns:
  - name: CODIGO_CONCEPTO
    data_type: varchar(50)
    description: Clave conformada del concepto. Usa AIGUA:<TIPUS_CONCEPTE> para componentes de L4_FACT_AIGUA y CONCEPTE:<NUM_CONCEPTE> para conceptos
      explícitos.
    tests:
    - not_null
    - unique
  - name: CODIGO_ORIGEN
    data_type: varchar(30)
    description: Código original del concepto antes de aplicar el prefijo conformado.
    tests:
    - not_null
  - name: DESCRIPCION
    data_type: varchar
    description: Descripción funcional completa del concepto.
    tests:
    - not_null
  - name: DESCRIPCION_BREVE
    data_type: varchar
    description: Descripción breve utilizada en informes y segmentadores.
  - name: GRUPO_FUNCIONAL
    data_type: varchar(50)
    description: Agrupación analítica del concepto, por ejemplo CONSUMO_AGUA, CUOTA_SERVICIO, CANON_AGUA, IVA o BONIFICACION.
    tests:
    - not_null
  - name: ES_CONSUMO
    data_type: boolean
    description: Indica que el concepto representa consumo físico de agua.
    tests:
    - not_null
  - name: ES_SERVICIO
    data_type: boolean
    description: Indica que el concepto representa un servicio facturado.
    tests:
    - not_null
  - name: ES_TRIBUTO
    data_type: boolean
    description: Indica que el concepto tiene naturaleza tributaria o de tasa.
    tests:
    - not_null
  - name: ES_BONIFICACION
    data_type: boolean
    description: Indica que el concepto representa una bonificación; su importe puede ser negativo.
    tests:
    - not_null
  - name: ES_IVA
    data_type: boolean
    description: Indica que el concepto representa IVA.
    tests:
    - not_null
  - name: ES_ADITIVO
    data_type: boolean
    description: Indica que el importe del concepto forma parte de la suma que reconstruye IMP_TOTAL_FACT.
    tests:
    - not_null
  - name: ORIGEN_CONCEPTO
    data_type: varchar(50)
    description: 'Procedencia funcional original del concepto: L4_FACT_AIGUA, L4_FACT_CONCEPTE o GOLD para el miembro desconocido.'
    tests:
    - not_null
  - name: ID_CARGA
    data_type: number
    description: Identificador técnico del lote heredado de la fuente S_FACTURA_CONCEPTO. Para miembros desconocidos o filas generadas en Gold
      se informa con un valor técnico controlado.
    tests:
    - not_null
  - name: FECHA_EXTRACCION
    data_type: timestamp_tz
    description: Fecha y hora de extracción heredada de la fuente S_FACTURA_CONCEPTO. Puede ser nula únicamente en miembros técnicos generados
      directamente en Gold.
  - name: FECHA_CARGA
    data_type: timestamp_tz
    description: Fecha y hora de materialización del registro en Gold, calculada con la fecha del sistema en la zona horaria Europe/Madrid.
    tests:
    - not_null
  - name: SISTEMA_ORIGEN
    data_type: varchar(30)
    description: Sistema de origen heredado de S_FACTURA_CONCEPTO. Para miembros técnicos generados en Gold se informa como GOLD.
    tests:
    - not_null
  - name: TABLA_ORIGEN
    data_type: varchar(50)
    description: Tabla Silver principal utilizada como fuente inmediata del registro Gold. Para filas técnicas generadas se conserva el nombre
      lógico de la fuente o del proceso generador.
    tests:
    - not_null
- name: g_b_suministro_actividad
  description: 'Bridge multivaluado entre suministros y actividades económicas. Granularidad: una fila por combinación HK_SUBMIN_SERVEI y HK_ACTIVIDAD_ECONOMICA.
    Permite representar varios epígrafes por suministro sin duplicar los hechos de factura. No se expone inicialmente en el dataset principal
    de Power BI.'
  config:
    materialized: table
    meta:
      layer: gold_fact
      entity_type: bridge
      grain: una fila por suministro y actividad economica
  tests:
  - dbt_utils.unique_combination_of_columns:
      arguments:
        combination_of_columns:
        - HK_SUBMIN_SERVEI
        - HK_ACTIVIDAD_ECONOMICA
  columns:
  - name: HK_SUBMIN_SERVEI
    data_type: string
    description: Clave del suministro participante en la relación.
    tests:
    - not_null
    - relationships:
        arguments:
          to: '{{ ref(''g_d_suministro'') }}'
          field: HK_SUBMIN_SERVEI
  - name: HK_ACTIVIDAD_ECONOMICA
    data_type: string
    description: Clave de la actividad económica participante en la relación.
    tests:
    - not_null
    - relationships:
        arguments:
          to: '{{ ref(''g_d_actividad_economica'') }}'
          field: HK_ACTIVIDAD_ECONOMICA
  - name: HK_EPIGRAF_IAE
    data_type: string
    description: Clave hash original del epígrafe IAE.
  - name: SECCIO
    data_type: varchar(1)
    description: Sección IAE asociada a la relación.
  - name: EPIGRAF_IAE
    data_type: varchar(4)
    description: Código del epígrafe IAE asociado.
  - name: ES_ACTIVIDAD_INDUSTRIAL_PRINCIPAL
    data_type: boolean
    description: Indicador derivado de sección I en el piloto.
    tests:
    - not_null
  - name: ES_ACTIVIDAD_SERVICIOS_SECUNDARIA
    data_type: boolean
    description: Indicador derivado de sección S en el piloto.
    tests:
    - not_null
  - name: ID_CARGA
    data_type: number
    description: Identificador técnico del lote heredado de la fuente EDW_L_SUBMIN_IAE. Para miembros desconocidos o filas generadas en Gold se
      informa con un valor técnico controlado.
    tests:
    - not_null
  - name: FECHA_EXTRACCION
    data_type: timestamp_tz
    description: Fecha y hora de extracción heredada de la fuente EDW_L_SUBMIN_IAE. Puede ser nula únicamente en miembros técnicos generados directamente
      en Gold.
  - name: FECHA_CARGA
    data_type: timestamp_tz
    description: Fecha y hora de materialización del registro en Gold, calculada con la fecha del sistema en la zona horaria Europe/Madrid.
    tests:
    - not_null
  - name: SISTEMA_ORIGEN
    data_type: varchar(30)
    description: Sistema de origen heredado de EDW_L_SUBMIN_IAE. Para miembros técnicos generados en Gold se informa como GOLD.
    tests:
    - not_null
  - name: TABLA_ORIGEN
    data_type: varchar(50)
    description: Tabla Silver principal utilizada como fuente inmediata del registro Gold. Para filas técnicas generadas se conserva el nombre
      lógico de la fuente o del proceso generador.
    tests:
    - not_null
- name: g_b_suministro_colectivo
  description: 'Bridge temporal entre suministros y colectivos sociales. Granularidad: una fila por combinación HK_SUBMIN_SERVEI y HK_HIST_SS_PE.
    Mantiene el intervalo de vigencia del colectivo para determinar la vulnerabilidad de una factura en su fecha final. No se expone inicialmente
    en el dataset principal de Power BI.'
  config:
    materialized: table
    meta:
      layer: gold_fact
      entity_type: bridge
      grain: una fila por suministro y episodio historico de colectivo
  tests:
  - dbt_utils.unique_combination_of_columns:
      arguments:
        combination_of_columns:
        - HK_SUBMIN_SERVEI
        - HK_HIST_SS_PE
  columns:
  - name: HK_SUBMIN_SERVEI
    data_type: string
    description: Clave del suministro asociado al periodo social.
    tests:
    - not_null
    - relationships:
        arguments:
          to: '{{ ref(''g_d_suministro'') }}'
          field: HK_SUBMIN_SERVEI
  - name: HK_COLECTIVO
    data_type: string
    description: Clave del colectivo social.
    tests:
    - not_null
    - relationships:
        arguments:
          to: '{{ ref(''g_d_colectivo'') }}'
          field: HK_COLECTIVO
  - name: HK_HIST_SS_PE
    data_type: string
    description: Clave hash del episodio histórico de servicios sociales.
    tests:
    - not_null
  - name: TIP_COLECTIVO
    data_type: varchar(2)
    description: Código del colectivo social.
  - name: TS_MOM_IND
    data_type: timestamp
    description: Marca temporal que identifica el episodio histórico.
  - name: DATA_INI_IND
    data_type: date
    description: Fecha inicial de vigencia del indicador social.
  - name: DATA_FIN_IND
    data_type: date
    description: Fecha final de vigencia; es nula cuando el periodo permanece abierto.
  - name: OBSERVACIONS
    data_type: varchar
    description: Observaciones asociadas al episodio social.
  - name: ID_CARGA
    data_type: number
    description: Identificador técnico del lote heredado de la fuente EDW_L_SUBMIN_HIST_SS_PE. Para miembros desconocidos o filas generadas en
      Gold se informa con un valor técnico controlado.
    tests:
    - not_null
  - name: FECHA_EXTRACCION
    data_type: timestamp_tz
    description: Fecha y hora de extracción heredada de la fuente EDW_L_SUBMIN_HIST_SS_PE. Puede ser nula únicamente en miembros técnicos generados
      directamente en Gold.
  - name: FECHA_CARGA
    data_type: timestamp_tz
    description: Fecha y hora de materialización del registro en Gold, calculada con la fecha del sistema en la zona horaria Europe/Madrid.
    tests:
    - not_null
  - name: SISTEMA_ORIGEN
    data_type: varchar(30)
    description: Sistema de origen heredado de EDW_L_SUBMIN_HIST_SS_PE. Para miembros técnicos generados en Gold se informa como GOLD.
    tests:
    - not_null
  - name: TABLA_ORIGEN
    data_type: varchar(50)
    description: Tabla Silver principal utilizada como fuente inmediata del registro Gold. Para filas técnicas generadas se conserva el nombre
      lógico de la fuente o del proceso generador.
    tests:
    - not_null
- name: g_h_factura
  description: 'Hecho de cabecera de factura. Granularidad: una fila por NUM_PARTICIO, ID_EMPRESA, ANY_FACTURA y NUM_FACTURA. Conserva las medidas
    de cabecera, el tipo de suministro congelado, indicadores analíticos y claves dimensionales. IMP_TOTAL_FACT e IMP_AIGUA_IVA solo deben agregarse
    a grano factura y no después de unir directamente la cabecera con múltiples líneas de concepto.'
  config:
    materialized: table
    meta:
      layer: gold_fact
      entity_type: fact
      grain: una fila por particion, empresa, anyo y numero de factura
  tests:
  - dbt_utils.unique_combination_of_columns:
      arguments:
        combination_of_columns:
        - NUM_PARTICIO
        - ID_EMPRESA
        - ANY_FACTURA
        - NUM_FACTURA
  columns:
  - name: HK_FACTURA
    data_type: string
    description: Clave hash de la factura calculada con NUM_PARTICIO, ID_EMPRESA, ANY_FACTURA y NUM_FACTURA.
    tests:
    - not_null
    - unique
  - name: HK_SUBMIN_SERVEI
    data_type: string
    description: Clave foránea al suministro facturado.
    tests:
    - not_null
    - relationships:
        arguments:
          to: '{{ ref(''g_d_suministro'') }}'
          field: HK_SUBMIN_SERVEI
  - name: HK_TIPO_SUMINISTRO
    data_type: string
    description: Clave foránea del tipo de suministro congelado en la factura.
    tests:
    - not_null
    - relationships:
        arguments:
          to: '{{ ref(''g_d_tipo_suministro'') }}'
          field: HK_TIPO_SUMINISTRO
  - name: HK_TIPO_USO_AGUA
    data_type: string
    description: Clave hash del uso del agua congelado en la factura.
  - name: HK_TIPO_VIVIENDA
    data_type: string
    description: Clave hash del tipo de vivienda congelado en la factura.
  - name: NUM_PARTICIO
    data_type: number(2,0)
    description: Número de partición técnica. Primera columna de la clave natural.
    tests:
    - not_null
  - name: ID_EMPRESA
    data_type: varchar(2)
    description: Empresa emisora. Segunda columna de la clave natural.
    tests:
    - not_null
  - name: ANY_FACTURA
    data_type: varchar(4)
    description: Año de numeración. Tercera columna de la clave natural.
    tests:
    - not_null
  - name: NUM_FACTURA
    data_type: number(7,0)
    description: Número secuencial. Cuarta columna de la clave natural.
    tests:
    - not_null
  - name: POLISSA_SUBM
    data_type: varchar(10)
    description: Póliza de suministro facturada.
    tests:
    - not_null
  - name: DATA_INI_FACT
    data_type: date
    description: Fecha inicial del periodo facturado.
    tests:
    - not_null
    - relationships:
        arguments:
          to: '{{ ref(''g_d_fecha'') }}'
          field: FECHA
  - name: DATA_FIN_FACT
    data_type: date
    description: Fecha final del periodo facturado.
    tests:
    - not_null
    - relationships:
        arguments:
          to: '{{ ref(''g_d_fecha'') }}'
          field: FECHA
  - name: DATA_EMISS_FACT
    data_type: date
    description: Fecha de emisión de la factura.
    tests:
    - not_null
    - relationships:
        arguments:
          to: '{{ ref(''g_d_fecha'') }}'
          field: FECHA
  - name: DATA_CARREC_RECAP
    data_type: date
    description: Fecha de cargo o transferencia a recaudación.
    tests:
    - relationships:
        arguments:
          to: '{{ ref(''g_d_fecha'') }}'
          field: FECHA
  - name: ANY_CALENDARI
    data_type: varchar(2)
    description: Año del calendario operativo de facturación.
  - name: MES_CALENDARI
    data_type: varchar(2)
    description: Mes del calendario operativo de facturación.
  - name: FREQ_FACT
    data_type: varchar(1)
    description: Frecuencia de facturación.
  - name: DIES_FACTURATS
    data_type: number
    description: Número inclusivo de días facturados.
  - name: TIP_SUBM_SERV_FACTURA
    data_type: varchar(1)
    description: 'Tipo de suministro congelado en la factura: D, I o C.'
    tests:
    - accepted_values:
        arguments:
          values:
          - D
          - I
          - C
  - name: US_AIGUA_SUBM_FACT
    data_type: varchar(1)
    description: Uso del agua congelado en el momento de facturación.
  - name: TIP_HABIT_SUBM_FA
    data_type: varchar(1)
    description: Tipo de vivienda congelado en la factura.
  - name: NOMB_HABIT_FACT
    data_type: number(3,0)
    description: Número de habitantes considerado en la factura.
  - name: SIT_SUBM_SERV_FACT
    data_type: varchar(1)
    description: Situación del suministro congelada en la factura.
  - name: TIP_DOMESTIC
    data_type: varchar(1)
    description: Subtipología doméstica aplicada.
  - name: CONSUM_TOTAL_M3
    data_type: number
    description: Consumo total en m3. Medida aditiva a grano factura-partición.
    tests:
    - not_null
    config:
      meta:
        measure_type: additive
        unit: m3
  - name: IMP_TOTAL_FACT
    data_type: number(11,2)
    description: Importe total final de la factura. Debe cuadrar con la suma de conceptos aditivos.
    tests:
    - not_null
    config:
      meta:
        measure_type: additive_at_invoice_grain
        currency: EUR
  - name: IMP_AIGUA_IVA
    data_type: number(11,2)
    description: Suma de los componentes monetarios procedentes de FACT_AIGUA, incluido el IVA correspondiente.
    tests:
    - not_null
    config:
      meta:
        measure_type: additive_at_invoice_grain
        currency: EUR
  - name: NUM_CONCEPTOS_TOTAL
    data_type: number
    description: Número total de líneas económicas normalizadas de la factura.
    tests:
    - not_null
  - name: NUM_CONCEPTOS_AGUA
    data_type: number
    description: Número de líneas derivadas de L4_FACT_AIGUA.
    tests:
    - not_null
  - name: NUM_CONCEPTOS_EXPLICITOS
    data_type: number
    description: Número de líneas procedentes de L4_FACT_CONCEPTE.
    tests:
    - not_null
  - name: TIENE_RECUPERACION
    data_type: boolean
    description: Indicador explícito de recuperación, verdadero cuando ID_RECUPERACIO es S. Se valida contra la existencia de g_h_recuperacion.
    tests:
    - not_null
  - name: TIENE_REGULARIZACION
    data_type: boolean
    description: Indicador explícito de regularización, verdadero cuando ID_REGULARITZACIO es S. Se valida contra la existencia de g_h_regularizacion.
    tests:
    - not_null
  - name: TIENE_ACTIVIDAD_INDUSTRIAL
    data_type: boolean
    description: Indica que el suministro posee al menos una actividad marcada como industrial principal.
    tests:
    - not_null
  - name: ES_VULNERABLE
    data_type: boolean
    description: Indica que la fecha final de factura pertenece a un intervalo social vigente.
    tests:
    - not_null
  - name: ES_FRAUDULENTA
    data_type: boolean
    description: Indica que la factura es posterior o igual a DATA_CREA_C_FRA de la última versión canónica del convenio de fraude mientras el
      suministro permanezca en la tabla.
    tests:
    - not_null
  - name: ID_CARGA
    data_type: number
    description: Identificador técnico del lote heredado de la fuente S_FACTURA. Para miembros desconocidos o filas generadas en Gold se informa
      con un valor técnico controlado.
    tests:
    - not_null
  - name: FECHA_EXTRACCION
    data_type: timestamp_tz
    description: Fecha y hora de extracción heredada de la fuente S_FACTURA. Puede ser nula únicamente en miembros técnicos generados directamente
      en Gold.
  - name: FECHA_CARGA
    data_type: timestamp_tz
    description: Fecha y hora de materialización del registro en Gold, calculada con la fecha del sistema en la zona horaria Europe/Madrid.
    tests:
    - not_null
  - name: SISTEMA_ORIGEN
    data_type: varchar(30)
    description: Sistema de origen heredado de S_FACTURA. Para miembros técnicos generados en Gold se informa como GOLD.
    tests:
    - not_null
  - name: TABLA_ORIGEN
    data_type: varchar(50)
    description: Tabla Silver principal utilizada como fuente inmediata del registro Gold. Para filas técnicas generadas se conserva el nombre
      lógico de la fuente o del proceso generador.
    tests:
    - not_null
- name: g_h_factura_concepto
  description: 'Hecho de líneas económicas de factura. Granularidad: una fila por componente económico normalizado, factura y partición. Incluye
    componentes verticalizados de agua y conceptos explícitos. ORIGEN_CONCEPTO conserva la procedencia funcional L4, mientras TABLA_ORIGEN identifica
    la fuente Silver inmediata.'
  config:
    materialized: table
    meta:
      layer: gold_fact
      entity_type: fact
      grain: una fila por componente economico normalizado de factura
  columns:
  - name: HK_FACTURA_CONCEPTE
    data_type: string
    description: Clave hash única de la línea económica normalizada.
    tests:
    - not_null
    - unique
  - name: HK_FACTURA
    data_type: string
    description: Clave de la factura padre.
    tests:
    - not_null
    - relationships:
        arguments:
          to: '{{ ref(''g_h_factura'') }}'
          field: HK_FACTURA
  - name: HK_SUBMIN_SERVEI
    data_type: string
    description: Clave del suministro facturado.
    tests:
    - not_null
    - relationships:
        arguments:
          to: '{{ ref(''g_d_suministro'') }}'
          field: HK_SUBMIN_SERVEI
  - name: CODIGO_CONCEPTO
    data_type: varchar(50)
    description: 'Clave foránea conformada del concepto, con prefijo AIGUA: o CONCEPTE:.'
    tests:
    - not_null
    - relationships:
        arguments:
          to: '{{ ref(''g_d_concepto'') }}'
          field: CODIGO_CONCEPTO
  - name: ORIGEN_CONCEPTO
    data_type: varchar(50)
    description: 'Procedencia funcional original: L4_FACT_AIGUA o L4_FACT_CONCEPTE.'
    tests:
    - not_null
    - accepted_values:
        arguments:
          values:
          - L4_FACT_AIGUA
          - L4_FACT_CONCEPTE
  - name: NUM_PARTICIO
    data_type: number(2,0)
    description: Número de partición de la factura. Primera columna de la clave natural.
    tests:
    - not_null
  - name: ID_EMPRESA
    data_type: varchar(2)
    description: Empresa emisora. Segunda columna de la clave natural.
    tests:
    - not_null
  - name: ANY_FACTURA
    data_type: varchar(4)
    description: Año de factura. Tercera columna de la clave natural.
    tests:
    - not_null
  - name: NUM_FACTURA
    data_type: number(7,0)
    description: Número de factura. Cuarta columna de la clave natural.
    tests:
    - not_null
  - name: NUM_LINEA
    data_type: number(3,0)
    description: Orden estable de la línea dentro de la factura.
    tests:
    - not_null
  - name: TIPUS_CONCEPTE
    data_type: varchar
    description: Tipo analítico del componente.
  - name: NUM_CONCEPTE
    data_type: varchar(3)
    description: Código original del concepto explícito; es nulo para componentes derivados de agua.
  - name: DESC_CONCEPTE
    data_type: varchar
    description: Descripción funcional de la línea económica.
    tests:
    - not_null
  - name: POLISSA_SUBM
    data_type: varchar(10)
    description: Póliza de suministro facturada.
    tests:
    - not_null
  - name: DATA_INI_FACT
    data_type: date
    description: Fecha inicial del periodo de la factura.
    tests:
    - relationships:
        arguments:
          to: '{{ ref(''g_d_fecha'') }}'
          field: FECHA

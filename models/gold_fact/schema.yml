- name: g_s_concepto_clasificacion
  description: 'Seed Gold que clasifica funcionalmente los conceptos empleados por g_d_concepto. Granularidad: una fila por CODIGO_CONCEPTO conformado.
    Debe actualizarse cuando el test gold_fact_conceptos_sin_clasificar detecte un código nuevo.'

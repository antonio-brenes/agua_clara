- name: g_h_factura_situacion
  description: 'Hecho histórico de situaciones de factura. Granularidad: una fila por NUM_PARTICIO, ID_EMPRESA, ANY_FACTURA, NUM_FACTURA y MOM_INI_SITUACION.
    Permite reconstruir la secuencia de estados y determinar la situación vigente.'
  config:
    materialized: table
    meta:
      layer: gold_fact
      entity_type: fact
      grain: una fila por factura y momento inicial de situacion
  tests:
  - dbt_utils.unique_combination_of_columns:
      arguments:
        combination_of_columns:
        - NUM_PARTICIO
        - ID_EMPRESA
        - ANY_FACTURA
        - NUM_FACTURA
        - MOM_INI_SITUACION
  columns:
  - name: HK_FACTURA_SITUACION
    data_type: string
    description: Clave hash única del intervalo de situación.
    tests:
    - not_null
    - unique
  - name: HK_FACTURA
    data_type: string
    description: Clave de la factura padre.
    tests:
    - not_null
    - relationships:
        arguments:
          to: '{{ ref(''g_h_factura'') }}'
          field: HK_FACTURA
  - name: HK_SITUACION_FACT
    data_type: string
    description: Clave de la situación descrita.
    tests:
    - not_null
    - relationships:
        arguments:
          to: '{{ ref(''g_d_situacion_factura'') }}'
          field: HK_SITUACION_FACT
  - name: NUM_PARTICIO
    data_type: number(2,0)
    description: Número de partición. Primera columna de la clave natural.
    tests:
    - not_null
  - name: ID_EMPRESA
    data_type: varchar(2)
    description: Empresa emisora. Segunda columna de la clave natural.
    tests:
    - not_null
  - name: ANY_FACTURA
    data_type: varchar(4)
    description: Año de factura. Tercera columna de la clave natural.
    tests:
    - not_null
  - name: NUM_FACTURA
    data_type: number(7,0)
    description: Número de factura. Cuarta columna de la clave natural.
    tests:
    - not_null
  - name: MOM_INI_SITUACION
    data_type: timestamp_tz
    description: Momento de inicio de la situación y quinta columna de la clave natural.
    tests:
    - not_null
  - name: MOM_FIN_SITUACION
    data_type: timestamp_tz
    description: Momento final calculado como el inicio del siguiente estado; nulo para la situación actual.
  - name: NUM_ORDEN_SITUACION
    data_type: number
    description: Orden cronológico dentro de la factura.
    tests:
    - not_null
  - name: ES_SITUACION_ACTUAL
    data_type: boolean
    description: Indica que la fila representa la última situación conocida.
    tests:
    - not_null
  - name: TIP_SIT_FACT
    data_type: varchar(2)
    description: Código funcional de situación.
    tests:
    - not_null
  - name: DESC_SITUACION
    data_type: varchar
    description: Descripción completa de la situación.
  - name: DESC_BREU_SITUACION
    data_type: varchar
    description: Descripción breve de la situación.
  - name: CAUSA_SIT_FACT
    data_type: varchar(2)
    description: Código de causa del cambio de situación.
  - name: ID_CARGA
    data_type: number
    description: Identificador técnico del lote heredado de la fuente S_FACTURA_SITUACION_HIST. Para miembros desconocidos o filas generadas en
      Gold se informa con un valor técnico controlado.
    tests:
    - not_null
  - name: FECHA_EXTRACCION
    data_type: timestamp_tz
    description: Fecha y hora de extracción heredada de la fuente S_FACTURA_SITUACION_HIST. Puede ser nula únicamente en miembros técnicos generados
      directamente en Gold.
  - name: FECHA_CARGA
    data_type: timestamp_tz
    description: Fecha y hora de materialización del registro en Gold, calculada con la fecha del sistema en la zona horaria Europe/Madrid.
    tests:
    - not_null
  - name: SISTEMA_ORIGEN
    data_type: varchar(30)

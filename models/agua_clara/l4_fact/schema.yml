  - name: l4_situacio_fact
    description: "Histórico de transiciones de estado de las facturas."
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - NUM_PARTICIO
              - ID_EMPRESA
              - ANY_FACTURA
              - NUM_FACTURA
              - MOM_SIT_FACT
      - relationships_compound:
          arguments:
            to: "{{ ref('l4_fact_resum') }}"
            local_columns: [ID_EMPRESA, ANY_FACTURA, NUM_FACTURA]
            field_columns: [ID_EMPRESA, ANY_FACTURA, NUM_FACTURA]
    columns:
      - name: NUM_PARTICIO
        description: "Número de partición de la factura."
        tests:
          - not_null

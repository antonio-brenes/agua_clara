version: 2

seeds:
  - name: g_s_concepto_clasificacion
    description: Clasificación funcional y económica de los conceptos de factura utilizados en la capa gold_fact. Incluye conceptos derivados de L4_FACT_AIGUA y conceptos explícitos de L4_FACT_CONCEPTE.

    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - CODIGO_CONCEPTO

    columns:
      - name: CODIGO_CONCEPTO
        description: "Clave conformada del concepto, prefijada con AIGUA: para componentes de agua y CONCEPTE: para conceptos explícitos."
        tests:
          - not_null
          - unique

      - name: CODIGO_ORIGEN
        description: Código original del concepto.
        tests:
          - not_null

      - name: TABLA_ORIGEN
        description: "Procedencia lógica del concepto: L4_FACT_AIGUA o L4_FACT_CONCEPTE."
        tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - L4_FACT_AIGUA
                  - L4_FACT_CONCEPTE

      - name: GRUPO_FUNCIONAL
        description: Agrupación funcional utilizada para análisis en Power BI.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - CONSUMO_AGUA
                  - CUOTA_SERVICIO
                  - OTROS_SERVICIOS
                  - CANON_AGUA
                  - INFRAESTRUCTURA_HIDRAULICA
                  - ALCANTARILLADO
                  - SANEAMIENTO
                  - RESIDUOS
                  - CONSERVACION
                  - BONIFICACION
                  - EQUIPO_CI
                  - IVA
                  - OTROS

      - name: ES_CONSUMO
        tests:
          - not_null

      - name: ES_SERVICIO
        tests:
          - not_null

      - name: ES_TRIBUTO
        tests:
          - not_null

      - name: ES_BONIFICACION
        tests:
          - not_null

      - name: ES_IVA
        tests:
          - not_null

      - name: ES_ADITIVO
        description: Indica si el importe del concepto forma parte del total aditivo de la factura.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [true]
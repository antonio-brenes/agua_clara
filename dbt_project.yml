name: agua_clara
version: '1.0.0'
config-version: 2

profile: agua_clara

seed-paths: ["seeds"]
model-paths: ["models"]
macro-paths: ["macros"]
analysis-paths: ["analysis"]
clean-targets:
  - "target"
  - "dbt_packages"

models:

  agua_clara:

    l4_fact:
      +schema: l4_fact
      +materialized: table

    silver_edw:
      +schema: silver_edw
      +materialized: table

    silver_fact:
      +schema: silver_fact
      +materialized: table

    gold_fact:
      +schema: gold_fact
      +materialized: table

flags:
  require_generic_test_arguments_property: true

seeds:
  agua_clara:
    silver_fact:
      +schema: silver_fact
      +quote_columns: false
      s_seed_conceptos_agua:
        +column_types:
          NUM_CONCEPTO: varchar(10)
          DESC_CONCEPTO: varchar(255)
          DESC_BREVE_CONCEPTO: varchar(100)

      s_seed_clasificacion_conceptos:
        +column_types:
          NUM_CONCEPTO: varchar(10)
          GRUPO_FUNCIONAL: varchar(50)

          ES_CONSUMO: boolean
          ES_SERVICIO: boolean
          ES_TRIBUTO: boolean
          ES_BONIFICACION: boolean
          ES_IVA: boolean
          ES_ADITIVO: boolean

    l4_fact:
      +schema: l4_fact
      +quote_columns: false
      s_tip_conceptos_agua:
        +column_types:
          ORDEN: integer
          NUM_CONCEPTO: varchar(50)
          DESC_CONCEPTO: varchar(255)
          CANTIDAD: varchar(50)
          UNIDAD_MEDIDA: varchar(50)
          BASE_CALCULO: varchar(50)
          TIPO_TASA: varchar(30)
          PRECIO_UNITARIO: varchar(50)
          PORCENTAJE: varchar(50)
          IMP_CONCEPTO: varchar(50)